<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>漫画廊 · Comic Gallery</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
:root{
  --ink:#15121a;          /* 页底：墨紫 */
  --panel:#1d1826;        /* 卡片面 */
  --panel2:#241e31;       /* 悬停/抬升面 */
  --paper:#e9e2d8;        /* 正文：暖纸色 */
  --muted:#8f86a1;        /* 次要文字 */
  --faint:#5f5673;        /* 三级文字 */
  --line:rgba(233,226,216,.09);  /* 发丝线 */
  --line2:rgba(233,226,216,.16);
  --rose:#e05a7f;         /* 唯一强调色 */
  --rose-soft:rgba(224,90,127,.10);
  --violet:#8b7cf6;       /* Telegram 功能性用色 */
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Consolas,"Liberation Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:radial-gradient(1100px 700px at 75% -15%, rgba(224,90,127,.045), transparent 60%), var(--ink);
  color:var(--paper);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
  min-height:100vh;
}
::selection{background:var(--rose-soft);color:var(--rose)}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:2px}
/* ── 刊头（sticky）── */
.top{position:sticky;top:0;z-index:100;background:var(--ink);border-bottom:1px solid var(--line)}
.top-in{max-width:1440px;margin:auto;display:flex;align-items:center;gap:22px;padding:14px 20px;flex-wrap:wrap}
.mast{display:flex;flex-direction:column;line-height:1.1;cursor:pointer;user-select:none;white-space:nowrap}
.mast .cn{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.14em;color:var(--paper)}
.mast .en{font-family:var(--mono);font-size:9px;letter-spacing:.42em;color:var(--faint);margin-top:4px;text-transform:uppercase}
.mast .rule{width:34px;height:2px;background:var(--rose);margin-top:7px}
.srch{flex:1;min-width:200px;max-width:520px;display:flex;align-items:baseline;gap:10px}
.srch label{font-family:var(--mono);font-size:10px;letter-spacing:.25em;color:var(--faint);text-transform:uppercase}
.sb{flex:1;background:transparent;border:none;border-bottom:1px solid var(--line2);padding:6px 2px;color:var(--paper);font-size:14px;outline:none;border-radius:0;transition:border-color .15s}
.sb:focus{border-bottom-color:var(--rose)}
.sb::placeholder{color:var(--faint)}
.acts{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.tbtn{background:transparent;color:var(--muted);border:1px solid var(--line2);padding:5px 12px;border-radius:3px;cursor:pointer;font-size:12px;white-space:nowrap;transition:color .15s,border-color .15s}
.tbtn:hover{color:var(--paper);border-color:var(--faint)}
.tbtn .n{font-family:var(--mono);font-size:10px;color:var(--faint)}
.tbtn.on{color:var(--rose);border-color:rgba(224,90,127,.45);background:var(--rose-soft)}
/* ── 筛选区（正常文档流）── */
.filters{max-width:1440px;margin:auto;padding:12px 20px 0}
.f-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.f-chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);color:var(--paper);font-size:12px;padding:3px 6px 3px 10px;border-radius:3px}
.f-chip button{background:none;border:none;color:var(--faint);cursor:pointer;font-size:12px;line-height:1;padding:2px 3px}
.f-chip button:hover{color:var(--rose)}
.f-clear{background:none;border:none;color:var(--rose);font-size:12px;cursor:pointer;padding:3px 4px;text-decoration:underline;text-underline-offset:3px}
.f-sec{border:1px solid var(--line);border-radius:4px;margin-bottom:8px}
.f-sec summary{cursor:pointer;padding:8px 12px;font-size:12px;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px;user-select:none;font-family:var(--sans)}
.f-sec summary::-webkit-details-marker{display:none}
.f-sec summary::before{content:"＋";color:var(--faint);font-size:10px;transition:transform .15s}
.f-sec[open] summary::before{content:"－"}
.f-sec summary:hover{color:var(--paper)}
.f-sec summary .n{font-family:var(--mono);font-size:10px;color:var(--rose)}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 10px;max-height:160px;overflow-y:auto}
.chip{background:transparent;border:1px solid var(--line);color:var(--muted);padding:2px 9px;border-radius:3px;cursor:pointer;font-size:12px;white-space:nowrap;transition:color .12s,border-color .12s}
.chip:hover{color:var(--paper);border-color:var(--faint)}
.chip.on{background:var(--rose-soft);color:var(--rose);border-color:rgba(224,90,127,.4)}
/* ── 主区 ── */
main{max-width:1440px;margin:auto;padding:14px 20px 26px}
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:12px}
.cnt b{color:var(--paper);font-weight:600}
.sort{background:transparent;color:var(--paper);border:1px solid var(--line2);border-radius:3px;padding:4px 8px;font-size:12px;outline:none;cursor:pointer}
.sort:focus{border-color:var(--rose)}
/* 书架网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(192px,1fr));gap:16px}
.cd{background:var(--panel);border:1px solid var(--line);border-radius:5px;overflow:hidden;cursor:pointer;position:relative;display:flex;flex-direction:column;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.cd:hover{transform:translateY(-3px);border-color:rgba(224,90,127,.45);box-shadow:0 12px 26px rgba(0,0,0,.38)}
/* 签名：书脊 */
.spine{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rose);opacity:0;z-index:3;overflow:hidden;transition:width .18s ease,opacity .18s ease;display:flex;align-items:center;justify-content:center}
.spine b{font-family:var(--mono);font-size:9px;font-weight:400;letter-spacing:.3em;color:var(--paper);writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap;opacity:0;transition:opacity .15s}
.cd:hover .spine{opacity:1;width:22px}
.cd:hover .spine b{opacity:1}
.cvw{position:relative;overflow:hidden;aspect-ratio:3/4;background:linear-gradient(150deg,var(--panel2),var(--panel))}
.cvw .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:34px;opacity:.22}
.cv{position:relative;width:100%;height:100%;object-fit:cover;display:block;background:var(--panel2)}
/* 藏书标记（替代爱心 emoji） */
.fav{position:absolute;top:7px;right:7px;z-index:3;background:rgba(21,18,26,.6);border:1px solid var(--line2);width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--serif);font-size:12px;color:var(--muted);transition:all .15s;opacity:0;border-radius:3px}
.cd:hover .fav,.fav.on{opacity:1}
.fav:hover{border-color:var(--rose);color:var(--rose)}
.fav.on{color:var(--rose);border-color:rgba(224,90,127,.5);background:var(--rose-soft)}
.cb-wrap{position:absolute;top:7px;left:7px;z-index:3;display:none}
body.manage .cb-wrap{display:block}
.cb-wrap input{width:16px;height:16px;cursor:pointer;accent-color:var(--rose)}
/* 扉页信息 */
.if{padding:10px 12px 11px;display:flex;flex-direction:column;gap:3px;flex:1}
.tt{font-size:13px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tt.rw{color:var(--faint);font-size:11px;font-weight:400;-webkit-line-clamp:1}
.mt{font-family:var(--mono);color:var(--faint);font-size:10px;letter-spacing:.03em;margin-top:2px}
.au{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgx{color:var(--faint);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk{display:flex;gap:12px;margin-top:8px;padding-top:7px;border-top:1px solid var(--line)}
.lb{background:none;border:none;padding:0;text-decoration:none;font-size:11px;cursor:pointer;color:var(--muted);transition:color .12s;letter-spacing:.04em}
.lb:hover{color:var(--paper);text-decoration:underline;text-underline-offset:3px}
.lb.tp{color:var(--rose)}
.lb.tp:hover{color:var(--rose)}
.lb.tg{color:var(--violet)}
.lb.tg:hover{color:var(--violet)}
/* 骨架 */
.sk{background:var(--panel);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.sk-cover{aspect-ratio:3/4;background:linear-gradient(100deg,var(--panel) 40%,var(--panel2) 50%,var(--panel) 60%);background-size:200% 100%;animation:shimmer 1.3s infinite}
.sk-line{height:9px;margin:9px 12px 0;border-radius:2px;background:linear-gradient(100deg,var(--panel) 40%,var(--panel2) 50%,var(--panel) 60%);background-size:200% 100%;animation:shimmer 1.3s infinite}
.sk-line.w40{width:40%;margin-bottom:12px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* 分页 */
.pag{display:flex;justify-content:center;gap:4px;margin-top:24px;flex-wrap:wrap}
.pb{background:transparent;color:var(--muted);border:1px solid var(--line);padding:5px 11px;border-radius:3px;cursor:pointer;font-family:var(--mono);font-size:11px;min-width:30px;text-align:center;transition:color .12s,border-color .12s}
.pb-dot{color:var(--faint);padding:0 4px}
.pg-jump{display:inline-flex;align-items:center;gap:5px;margin-left:10px;vertical-align:middle}
.pg-jump input{width:56px;background:var(--ink);border:1px solid var(--line2);color:var(--paper);border-radius:3px;padding:5px 6px;font-family:var(--mono);font-size:11px;text-align:center;outline:none}
.pg-jump input:focus{border-color:var(--rose)}
.pg-jump .pb{min-width:auto;padding:5px 9px}
.pb:hover{color:var(--paper);border-color:var(--faint)}
.pb.on{color:var(--rose);border-color:rgba(224,90,127,.5);background:var(--rose-soft)}
.pb:disabled{opacity:.3;cursor:default}
.pb:disabled:hover{color:var(--muted);border-color:var(--line)}
.pb-dot{align-self:center;color:var(--faint);font-family:var(--mono);font-size:11px;padding:0 2px}
.foot{max-width:1440px;margin:auto;padding:18px 20px 64px;text-align:center;color:var(--faint);font-family:var(--mono);font-size:10px;letter-spacing:.06em}
/* 底栏（管理模式） */
#del-bar{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--rose);padding:10px 20px;display:none;align-items:center;gap:14px;z-index:150;font-size:13px;flex-wrap:wrap}
#del-bar .cnt{color:var(--paper);flex:1;min-width:110px}
.del-cancel{background:transparent;color:var(--muted);border:1px solid var(--line2);padding:6px 14px;border-radius:3px;cursor:pointer;font-size:12px}
.del-cancel:hover{color:var(--paper);border-color:var(--faint)}
.del-go{background:var(--rose);color:#1a0f14;border:none;padding:6px 18px;border-radius:3px;cursor:pointer;font-weight:600;font-size:12px}
.del-go:hover{background:#ec6f90}
/* 弹窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(10,8,14,.72);z-index:200;display:none;align-items:center;justify-content:center;padding:18px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:8px;max-width:660px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 28px 70px rgba(0,0,0,.55)}
.modal::-webkit-scrollbar{width:8px}
.modal::-webkit-scrollbar-thumb{background:var(--panel2);border-radius:4px}
.m-head{display:flex;gap:20px;padding:22px;flex-wrap:wrap}
.m-cover{width:180px;border-radius:4px;overflow:hidden;border:1px solid var(--line2);flex-shrink:0;aspect-ratio:3/4;background:var(--panel2)}
.m-cover img{width:100%;height:100%;object-fit:cover;display:block}
.m-info{flex:1;min-width:230px}
.m-info h2{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.45;margin-bottom:4px}
.m-orig{color:var(--faint);font-size:12px;margin-bottom:12px;word-break:break-all}
.m-meta{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-family:var(--mono);font-size:11px;margin-bottom:14px}
.m-meta b{color:var(--rose);font-weight:600}
.m-sec{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.28em;text-transform:uppercase;margin:14px 0 7px}
.m-tags{display:flex;flex-wrap:wrap;gap:5px}
.m-tag{background:transparent;border:1px solid var(--line);color:var(--muted);padding:2px 10px;border-radius:3px;cursor:pointer;font-size:12px;transition:color .12s,border-color .12s}
.m-tag:hover{color:var(--rose);border-color:rgba(224,90,127,.45)}
/* 标签编辑 */
.m-tag-edit{margin-top:8px;display:inline-block;background:none;border:1px dashed var(--line2);color:var(--faint);padding:2px 12px;border-radius:3px;cursor:pointer;font-size:11px;transition:all .12s}
.m-tag-edit:hover{color:var(--rose);border-color:rgba(224,90,127,.5)}
.tag-edit-input{width:100%;background:var(--ink);border:1px solid var(--line2);color:var(--paper);border-radius:4px;padding:8px 10px;font-size:13px;margin-bottom:10px;outline:none}
.tag-edit-input:focus{border-color:var(--rose)}
.tag-edit-hint{color:var(--faint);font-size:11px;margin-bottom:10px;line-height:1.6}
.tag-edit-row{display:flex;gap:8px}
.tag-edit-btn{flex:1;padding:7px 0;border-radius:3px;border:1px solid var(--line2);background:transparent;color:var(--muted);cursor:pointer;font-size:12px;transition:all .12s}
.tag-edit-btn:hover{color:var(--paper);border-color:var(--faint)}
.tag-edit-btn.primary{background:var(--rose);border-color:var(--rose);color:#1a0f14;font-weight:600}
.tag-edit-btn.primary:hover{opacity:.85}
.tag-sug{display:inline-block;background:transparent;border:1px solid var(--line);color:var(--muted);padding:1px 8px;border-radius:3px;cursor:pointer;font-size:11px;margin:2px}
.tag-sug:hover{color:var(--rose);border-color:rgba(224,90,127,.45)}
.m-actions{display:flex;gap:16px;margin-top:18px;flex-wrap:wrap}
.m-actions .lb{font-size:13px;padding:0;border:none;background:none}
.m-fav{margin-top:14px;background:transparent;color:var(--muted);border:1px solid var(--line2);padding:7px 0;border-radius:3px;cursor:pointer;font-size:12px;transition:all .12s;width:100%}
.m-fav:hover{border-color:var(--faint);color:var(--paper)}
.m-fav.on{color:var(--rose);border-color:rgba(224,90,127,.5);background:var(--rose-soft)}
/* 确认隐藏弹窗 */
.del-modal{padding:22px;max-width:430px;width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:8px;box-shadow:0 28px 70px rgba(0,0,0,.55)}
.del-modal h3{font-family:var(--serif);font-size:17px;margin-bottom:10px}
.del-modal p{color:var(--muted);font-size:12px;margin-bottom:8px;line-height:1.6}
.del-list{background:var(--ink);border-radius:4px;padding:10px 14px;max-height:180px;overflow-y:auto;margin:10px 0;font-size:12px;color:var(--paper);list-style:none;border:1px solid var(--line)}
.del-list li{padding:3px 0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px}
.del-list li:last-child{border-bottom:none}
.del-status{color:var(--rose);font-size:12px;min-height:1.2em}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row button{flex:1;padding:9px;border-radius:3px;border:none;cursor:pointer;font-weight:600;font-size:13px}
/* Toast */
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(14px);background:var(--panel);color:var(--paper);padding:9px 20px;border-radius:3px;font-size:12px;border:1px solid var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:all .25s ease;z-index:300;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 回顶 */
.totop{position:fixed;right:22px;bottom:24px;width:40px;height:40px;border-radius:3px;background:var(--panel);color:var(--muted);border:1px solid var(--line2);cursor:pointer;font-size:16px;opacity:0;pointer-events:none;transition:all .2s;z-index:120;box-shadow:0 8px 22px rgba(0,0,0,.4)}
.totop.show{opacity:1;pointer-events:auto}
.totop:hover{color:var(--rose);border-color:rgba(224,90,127,.45);transform:translateY(-2px)}
#error{text-align:center;padding:60px 20px;color:var(--rose)}
.empty{text-align:center;padding:76px 20px;color:var(--muted)}
.empty .e-t{font-family:var(--serif);font-size:19px;color:var(--paper);display:block;margin-bottom:6px}
.empty small{color:var(--faint);font-size:12px}
.empty button{background:none;border:none;color:var(--rose);font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-top:12px}
/* 滚动条 */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2b2438;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#372e4a}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
}
@media(max-width:640px){
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .m-cover{width:100%;max-width:230px;margin:auto}
  .top-in{gap:10px}
  .mast .cn{font-size:18px}
  .srch{order:3;flex-basis:100%;max-width:none}
  .filters,.main,main{padding-left:12px;padding-right:12px}
  .f-sec summary{padding:7px 10px}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="mast" onclick="resetAll()" title="回到全部">
      <span class="cn">漫画廊</span>
      <span class="en">Comic Gallery</span>
      <span class="rule"></span>
    </div>
    <div class="srch">
      <label for="sb">检索</label>
      <input id="sb" class="sb" placeholder="标题、作者或标签" autocomplete="off">
    </div>
    <div class="acts">
      <button class="tbtn" id="fav-btn" onclick="toggleFavOnly()" title="只看收藏">收藏 <span class="n" id="fav-n">0</span></button>
      <button class="tbtn" id="orig-btn" onclick="tg()" title="切换中文/原名显示">原名</button>
      <button class="tbtn" id="mng-btn" onclick="toggleManage()">管理</button>
      <button class="tbtn" id="hbtn" onclick="toggleHidden()" title="查看被隐藏的漫画">隐藏区</button>
    </div>
  </div>
</header>

<div class="filters">
  <div class="f-row" id="active-filters" style="display:none"></div>
  <details class="f-sec" id="author-sec" open>
    <summary>作者 <span class="n" id="acnt">0</span></summary>
    <div class="chips" id="ab"></div>
  </details>
  <details class="f-sec" id="circle-sec">
    <summary>团队 <span class="n" id="ccnt">0</span></summary>
    <div class="chips" id="cib"></div>
  </details>
  <details class="f-sec" id="tag-sec">
    <summary>标签 <span class="n" id="tcnt">0</span></summary>
    <div class="chips" id="cb"></div>
  </details>
</div>

<main>
  <div class="bar">
    <span class="cnt" id="status">载入中…</span>
    <select id="sort" class="sort" onchange="setSort(this.value)" title="排序">
      <option value="new">最新发布</option>
      <option value="old">最早发布</option>
      <option value="stars">评分最高</option>
      <option value="pages">页数最多</option>
    </select>
  </div>
  <div class="grid" id="g"></div>
  <div class="pag" id="pag" style="display:none"></div>
</main>

<footer class="foot">数据源 comic.labs.gay · 每日 06:00 自动同步 · 书架共 <span id="total-badge">—</span> 册 · <span style="opacity:.6">v8-batch</span></footer>

<div id="del-bar">
  <span class="cnt" id="del-cnt">已选 0 册</span>
  <button class="del-cancel" onclick="selectAllFiltered()">全选当前筛选</button>
  <button class="del-cancel" onclick="clearSelection()">取消</button>
  <button class="del-go" id="del-go-btn" onclick="showDeleteModal()">隐藏选中</button>
</div>

<!-- 详情弹窗 -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="detail-modal"></div>
</div>

<!-- 确认隐藏弹窗 -->
<div class="modal-overlay" id="del-overlay" onclick="if(event.target===this)closeDelModal()">
  <div class="del-modal">
    <h3><span id="del-verb">隐藏</span> <b id="del-count" style="color:var(--rose)">0</b> 册</h3>
    <p>这些漫画将从书架中移除，不再出现在列表与搜索里。数据保留在数据库中，随时可以恢复。</p>
    <ul class="del-list" id="del-list"></ul>
    <div class="del-status" id="del-status"></div>
    <div class="btn-row">
      <button style="background:transparent;color:var(--muted);border:1px solid var(--line2)" onclick="closeDelModal()">取消</button>
      <button id="del-confirm-btn" style="background:var(--rose);color:#1a0f14" onclick="confirmDelete()">确认隐藏</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<button class="totop" id="totop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
'use strict';
const $=id=>document.getElementById(id);

// ── 全局状态 ──
let ALL=[], TAGS=[], AUTHORS=[], CIRCLES=[];
let searchQ='', selAuthor=new Set(), selCircle=new Set(), selTag=new Set(), favOnly=false, showOrig=false;
let sortBy='new', page=1, perPage=48, totalPages=1;
let manage=false, filtered=[], selected=new Set(), deletedIds=new Set();
let hiddenMode=false, HIDDEN=[];
let favs=new Set(JSON.parse(localStorage.getItem('cg_favs')||'[]'));
let gPikPakState={};

// PikPak 下载服务器：固定域名隧道（dl.chenguodong.xyz），请求需带 X-DL-Token
const API_BASE='https://dl.chenguodong.xyz';
const DL_TOKEN='3fb38b4f2b055fd00203ef58a35b610c';

function esc(s){const d=document.createElement('div');d.textContent=(s==null?'':String(s));return d.innerHTML;}
// 封面走 Cloudflare 边缘缓存代理，加快国内加载
function coverUrl(u, w){return u?'/api/cover?u='+encodeURIComponent(u)+(w?'&w='+w:''):'';}
function fmtDate(s){if(!s)return '?';const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[1]+'.'+m[2]+'.'+m[3]:s.slice(0,10);}
// 收藏已迁移到数据库（D1），localStorage 仅做一次性迁移读取
async function loadFavs(){
  let local=[];
  try{local=JSON.parse(localStorage.getItem('cg_favs')||'[]');}catch(e){}
  let dbIds=[];
  try{
    const r=await fetch('/api/favorites');
    const d=await r.json();
    dbIds=Array.isArray(d.ids)?d.ids:[];
  }catch(e){console.log('load favorites error',e);}
  // 迁移：本地有而数据库没有的 → 批量写入数据库
  const localOnly=local.filter(id=>!dbIds.includes(id));
  if(localOnly.length){
    try{
      await fetch('/api/favorites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:localOnly})});
    }catch(e){console.log('fav migrate error',e);}
  }
  favs=new Set([...dbIds,...local]);
  try{localStorage.removeItem('cg_favs');}catch(e){}
}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);}

// ── 卡片渲染（书架上的书）──
function renderCard(c){
  const cd=document.createElement('div');
  cd.className='cd';cd.dataset.id=c.id;
  // 书脊（签名元素）
  const spine=document.createElement('div');spine.className='spine';
  const sn=document.createElement('b');sn.textContent='NO.'+c.id;spine.appendChild(sn);
  cd.appendChild(spine);
  // 复选框（管理模式）
  const cbw=document.createElement('div');cbw.className='cb-wrap';
  const cb=document.createElement('input');cb.type='checkbox';cb.dataset.id=c.id;
  cb.checked=selected.has(String(c.id));
  cb.addEventListener('click',e=>{e.stopPropagation();toggleSelect(c.id);});
  cbw.appendChild(cb);cd.appendChild(cbw);
  // 封面
  const cvw=document.createElement('div');cvw.className='cvw';
  const ph=document.createElement('div');ph.className='ph';ph.textContent='無題';cvw.appendChild(ph);
  const img=document.createElement('img');img.className='cv';img.loading='lazy';img.alt=c.title_cn||'';
  img.src=coverUrl(c.cover_url,480);img.onerror=function(){this.style.display='none';};
  cvw.appendChild(img);cd.appendChild(cvw);
  // 藏书标记
  const fav=document.createElement('div');fav.className='fav'+(favs.has(c.id)?' on':'');fav.textContent='藏';
  fav.title='收藏';fav.addEventListener('click',e=>{e.stopPropagation();toggleFav(c.id);});
  cvw.appendChild(fav);
  // 扉页信息
  const di=document.createElement('div');di.className='if';
  const cn=document.createElement('div');cn.className='tt cn';cn.textContent=c.title_cn||'無題';di.appendChild(cn);
  if(c.title_original){const rw=document.createElement('div');rw.className='tt rw';rw.textContent=c.title_original;di.appendChild(rw);}
  const mt=document.createElement('div');mt.className='mt';
  mt.textContent=fmtDate(c.published_at)+' · '+esc(c.pages||0)+'P · ★'+(c.stars||0);
  di.appendChild(mt);
  if(c.author){const au=document.createElement('div');au.className='au';au.textContent=c.author;di.appendChild(au);}
  if(c.circle){const ci=document.createElement('div');ci.className='au';ci.textContent='团队：'+c.circle;di.appendChild(ci);}
  if(c.tags&&c.tags.length){const tgx=document.createElement('div');tgx.className='tgx';tgx.textContent=c.tags.slice(0,4).join(' / ');di.appendChild(tgx);}
  // 动作：文字链接
  const lk=document.createElement('div');lk.className='lk';
  if(c.telegraph_url){const a=document.createElement('a');a.href=API_BASE+'/read?u='+encodeURIComponent(c.telegraph_url)+'&t='+DL_TOKEN;a.target='_blank';a.rel='noopener';a.className='lb tp';a.textContent='阅读';lk.appendChild(a);}
  if(c.telegram_url){const a=document.createElement('a');a.href=c.telegram_url;a.target='_blank';a.rel='noopener';a.className='lb tg';a.textContent='Telegram';lk.appendChild(a);}
  const pk=document.createElement('button');pk.className='lb';pk.type='button';
  pk.dataset.comicId=c.id;pk.dataset.url=c.telegraph_url||'';pk.dataset.title=c.title_cn||c.title_original||'';
  pk.dataset.titleOrig=c.title_original||'';pk.dataset.pages=c.pages||0;
  updatePikPakBtn(pk);
  lk.appendChild(pk);
  di.appendChild(lk);cd.appendChild(di);
  // 点击：管理模式=选择，浏览=详情
  cd.addEventListener('click',e=>{
    if(e.target.closest('a,button,input,.fav'))return;
    if(manage){toggleSelect(c.id);}
    else{openModal(c);}
  });
  return cd;
}

function skeletons(){
  let h='';
  for(let i=0;i<12;i++)h+='<div class="sk"><div class="sk-cover"></div><div class="sk-line"></div><div class="sk-line w40"></div></div>';
  $('g').innerHTML=h;
}

function renderGrid(){
  const g=$('g');g.innerHTML='';
  const start=(page-1)*perPage,end=Math.min(start+perPage,filtered.length);
  if(filtered.length===0){
    g.innerHTML='<div class="empty" style="grid-column:1/-1"><span class="e-t">'+(hiddenMode?'隐藏区空空如也':'架上没有这样的书')+'</span><small>'+(!hiddenMode?'换个关键词，或清除筛选条件':'隐藏的漫画都在这里')+'</small><br><button onclick="resetAll()">清除全部筛选</button></div>';
    $('pag').style.display='none';
    return;
  }
  const frag=document.createDocumentFragment();
  for(let i=start;i<end;i++)frag.appendChild(renderCard(filtered[i]));
  g.appendChild(frag);
  $('pag').style.display='flex';
  renderPagination();
}

// ── 筛选与排序 ──
function applyFilter(){
  const q=searchQ.toLowerCase();
  const src = hiddenMode ? HIDDEN : ALL;
  filtered=src.filter(c=>{
    if(!hiddenMode&&deletedIds.has(c.id))return false;
    if(favOnly&&!favs.has(c.id))return false;
    if(selAuthor.size&&!selAuthor.has(c.author))return false;
    if(selCircle.size&&!selCircle.has(c.circle))return false;
    if(selTag.size&&!c.tags.some(t=>selTag.has(t)))return false;
    if(q){
      const kws=q.split(/\s+/).filter(Boolean);
      for(const kw of kws){
        const inT=(c.title_cn&&c.title_cn.toLowerCase().includes(kw))||(c.title_original&&c.title_original.toLowerCase().includes(kw));
        const inA=c.author&&c.author.toLowerCase().includes(kw);
        const inTags=c.tags.some(t=>t.toLowerCase().includes(kw));
        if(!inT&&!inA&&!inTags)return false;
      }
    }
    return true;
  });
  filtered.sort((a,b)=>{
    if(sortBy==='old')return (a.published_at||'').localeCompare(b.published_at||'')||a.id-b.id;
    if(sortBy==='stars')return (parseFloat(b.stars)||0)-(parseFloat(a.stars)||0);
    if(sortBy==='pages')return (b.pages||0)-(a.pages||0);
    return (b.published_at||'').localeCompare(a.published_at||'')||b.id-a.id;
  });
  totalPages=Math.max(1,Math.ceil(filtered.length/perPage));
  if(page>totalPages)page=totalPages;
  const shown=Math.min(filtered.length,perPage);
  if(hiddenMode){
    $('status').innerHTML='隐藏区 <b>'+shown.toLocaleString()+'</b> / <b>'+filtered.length.toLocaleString()+'</b> 册 · 共 <b>'+HIDDEN.length.toLocaleString()+'</b> 册隐藏';
    $('total-badge').textContent=HIDDEN.length.toLocaleString();
  }else{
    $('status').innerHTML='架上 <b>'+shown.toLocaleString()+'</b> / <b>'+filtered.length.toLocaleString()+'</b> 册 · 共 <b>'+ALL.length.toLocaleString()+'</b> 册';
    $('total-badge').textContent=ALL.length.toLocaleString();
  }
  renderGrid();
  renderActiveFilters();
  updateDelBar();
  syncHash();
}

function renderChips(){
  const ab=$('ab'),cib=$('cib'),cb=$('cb');
  ab.innerHTML='';cib.innerHTML='';cb.innerHTML='';
  AUTHORS.forEach(a=>{
    const b=document.createElement('button');b.className='chip'+(selAuthor.has(a.name)?' on':'');
    b.textContent=a.name+' '+a.count;
    b.onclick=()=>{selAuthor.has(a.name)?selAuthor.delete(a.name):selAuthor.add(a.name);page=1;applyFilter();renderChips();};
    ab.appendChild(b);
  });
  CIRCLES.forEach(a=>{
    const b=document.createElement('button');b.className='chip'+(selCircle.has(a.name)?' on':'');
    b.textContent=a.name+' '+a.count;
    b.onclick=()=>{selCircle.has(a.name)?selCircle.delete(a.name):selCircle.add(a.name);page=1;applyFilter();renderChips();};
    cib.appendChild(b);
  });
  TAGS.forEach(t=>{
    const b=document.createElement('button');b.className='chip'+(selTag.has(t.name)?' on':'');
    b.textContent=t.name+' '+t.count;
    b.onclick=()=>{selTag.has(t.name)?selTag.delete(t.name):selTag.add(t.name);page=1;applyFilter();renderChips();};
    cb.appendChild(b);
  });
  $('acnt').textContent=selAuthor.size+'/'+AUTHORS.length;
  $('ccnt').textContent=selCircle.size+'/'+CIRCLES.length;
  $('tcnt').textContent=selTag.size+'/'+TAGS.length;
}

function renderActiveFilters(){
  const row=$('active-filters');
  const items=[];
  if(searchQ)items.push({label:'检索：'+searchQ,clear:()=>{searchQ='';$('sb').value='';page=1;applyFilter();}});
  if(favOnly)items.push({label:'仅收藏',clear:()=>{favOnly=false;page=1;applyFilter();updateTopBtns();}});
  selAuthor.forEach(a=>items.push({label:'作者：'+a,clear:()=>{selAuthor.delete(a);page=1;applyFilter();renderChips();}}));
  selCircle.forEach(a=>items.push({label:'团队：'+a,clear:()=>{selCircle.delete(a);page=1;applyFilter();renderChips();}}));
  selTag.forEach(t=>items.push({label:'标签：'+t,clear:()=>{selTag.delete(t);page=1;applyFilter();renderChips();}}));
  if(items.length===0){row.style.display='none';row.innerHTML='';return;}
  row.style.display='flex';
  row.innerHTML='';
  items.forEach(it=>{
    const c=document.createElement('span');c.className='f-chip';
    c.innerHTML=esc(it.label)+'<button title="移除">✕</button>';
    c.querySelector('button').onclick=it.clear;
    row.appendChild(c);
  });
  const cl=document.createElement('button');cl.className='f-clear';cl.textContent='清除全部';
  cl.onclick=resetAll;
  row.appendChild(cl);
}

function resetAll(){
  selAuthor.clear();selCircle.clear();selTag.clear();searchQ='';favOnly=false;
  $('sb').value='';page=1;sortBy='new';$('sort').value='new';
  applyFilter();renderChips();updateTopBtns();
  window.scrollTo({top:0,behavior:'smooth'});
}
function clearSearch(){searchQ='';$('sb').value='';page=1;applyFilter();}
function setSort(v){sortBy=v;page=1;applyFilter();}
function toggleFavOnly(){favOnly=!favOnly;page=1;applyFilter();updateTopBtns();}
async function toggleFav(id){
  const on=favs.has(id);
  on?favs.delete(id):favs.add(id);
  updateFavCount();
  document.querySelectorAll('.cd[data-id="'+id+'"] .fav').forEach(f=>f.classList.toggle('on',favs.has(id)));
  const mf=$('m-fav-btn');if(mf){mf.classList.toggle('on',favs.has(id));mf.textContent=favs.has(id)?'已藏入书架 ✓':'藏入书架';}
  try{
    const r=on
      ?await fetch('/api/favorites?comic_id='+id,{method:'DELETE'})
      :await fetch('/api/favorites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({comic_id:id})});
    if(!r.ok)throw new Error('sync fail');
    // 收藏 = 必须可见：若该漫画在隐藏区，服务端已自动解除隐藏 → 前端同步移回书架
    if(!on){
      const hi=HIDDEN.findIndex(c=>c.id===id);
      if(hi>=0){
        const [moved]=HIDDEN.splice(hi,1);
        ALL.push(moved);
        if(hiddenMode){rebuildFacets();applyFilter();}
      }
    }
    toast(on?'已移出书架':'已藏入书架');
  }catch(e){
    // 同步失败回滚
    on?favs.add(id):favs.delete(id);
    updateFavCount();
    document.querySelectorAll('.cd[data-id="'+id+'"] .fav').forEach(f=>f.classList.toggle('on',favs.has(id)));
    if(mf){mf.classList.toggle('on',favs.has(id));mf.textContent=favs.has(id)?'已藏入书架 ✓':'藏入书架';}
    toast('收藏同步失败，请重试');
  }
}
function updateFavCount(){const n=ALL.filter(c=>favs.has(c.id)).length;$('fav-n').textContent=n;}
function updateTopBtns(){
  $('fav-btn').classList.toggle('on',favOnly);
  $('orig-btn').classList.toggle('on',showOrig);
}
function tg(){showOrig=!showOrig;updateTopBtns();
  document.querySelectorAll('.tt.cn').forEach(e=>e.style.display=showOrig?'none':'');
  document.querySelectorAll('.tt.rw').forEach(e=>e.style.display=showOrig?'':'none');
}

// ── 分页 ──
function renderPagination(){
  const tp=totalPages;
  let h='<button class="pb" '+(page<=1?'disabled':'onclick="goPage('+(page-1)+')"')+'>‹</button>';
  const s=Math.max(1,page-4),e=Math.min(tp,page+4);
  if(s>1){h+='<button class="pb" onclick="goPage(1)">1</button>';if(s>2)h+='<span class="pb-dot">…</span>';}
  for(let i=s;i<=e;i++)h+='<button class="pb'+(i===page?' on':'')+'" onclick="goPage('+i+')">'+i+'</button>';
  if(e<tp){if(e<tp-1)h+='<span class="pb-dot">…</span>';h+='<button class="pb" onclick="goPage('+tp+')">'+tp+'</button>';}
  h+='<button class="pb" '+(page>=tp?'disabled':'onclick="goPage('+(page+1)+')"')+'>›</button>';
  h+='<span class="pg-jump"><input id="pg-input" type="number" min="1" max="'+tp+'" value="'+page+'" onkeydown="if(event.key===\'Enter\')jumpPage()"><button class="pb" onclick="jumpPage()">跳转</button></span>';
  $('pag').innerHTML=h;
}
function jumpPage(){
  const inp=$('pg-input');if(!inp)return;
  const p=parseInt(inp.value,10);
  if(!isNaN(p)&&p>=1&&p<=totalPages){goPage(p);}
  else{inp.value=page;toast('页码需在 1-'+totalPages+' 之间');}
}
function goPage(p){page=Math.max(1,Math.min(p,totalPages));renderGrid();window.scrollTo({top:0,behavior:'smooth'});}

// ── 详情弹窗 ──
let curComic=null;
const encArg=s=>encodeURIComponent(String(s)).replace(/'/g,'%27');
function openModal(c){
  curComic=c;
  const m=$('detail-modal');
  const tagsHtml=(Array.isArray(c.tags)?c.tags:[]).map(t=>'<span class="m-tag" onclick="tagFromModal(\''+encArg(t)+'\')">'+esc(t)+'</span>').join('');
  const authorHtml=c.author?'<div class="m-sec">作者</div><div class="m-tags"><span class="m-tag" style="color:var(--rose);border-color:rgba(224,90,127,.4)" onclick="authorFromModal(\''+encArg(c.author)+'\')">'+esc(c.author)+'</span></div>':'';
  const readHtml=c.telegraph_url?'<a class="lb tp" href="'+API_BASE+'/read?u='+encodeURIComponent(c.telegraph_url)+'&t='+DL_TOKEN+'" target="_blank" rel="noopener">阅读</a>':'';
  const tgHtml=c.telegram_url?'<a class="lb tg" href="'+esc(c.telegram_url)+'" target="_blank" rel="noopener">Telegram</a>':'';
  m.innerHTML=
    '<div class="m-head">'+
      '<div class="m-cover"><img src="'+esc(coverUrl(c.cover_url,900))+' " onerror="this.style.display=\'none\'"></div>'+
      '<div class="m-info">'+
        '<h2>'+esc(c.title_cn||'無題')+'</h2>'+
        (c.title_original?'<div class="m-orig">'+esc(c.title_original)+'</div>':'')+
        '<div class="m-meta">'+
          '<span>NO.<b>'+esc(c.id)+'</b></span>'+
          '<span>'+esc(fmtDate(c.published_at))+'</span>'+
          '<span><b>'+esc(c.pages||0)+'</b> P</span>'+
          '<span>★<b>'+esc(c.stars||0)+'</b></span>'+
        '</div>'+
        authorHtml+
        '<div class="m-sec">标签</div><div class="m-tags" id="m-tags-box">'+(tagsHtml||'<span style="color:var(--faint);font-size:12px">无标签</span>')+'</div>'+
        '<button class="m-tag-edit" onclick="openTagEditor()">✎ 编辑标签</button>'+
        '<div class="m-actions">'+readHtml+tgHtml+
          '<button class="lb" type="button" style="color:var(--paper)" data-comic-id="'+esc(c.id)+'" data-url="'+esc(c.telegraph_url||'')+'" data-title="'+esc(c.title_cn||c.title_original||'')+'" data-title-orig="'+esc(c.title_original||'')+'" data-pages="'+esc(c.pages||0)+'" id="m-pk-btn">PikPak 下载</button>'+
        '</div>'+
        '<button class="m-fav'+(favs.has(c.id)?' on':'')+'" id="m-fav-btn" onclick="toggleFav('+c.id+')">'+(favs.has(c.id)?'已藏入书架 ✓':'藏入书架')+'</button>'+
      '</div>'+
    '</div>';
  updatePikPakBtn($('m-pk-btn'));
  $('modal-overlay').style.display='flex';
}
function tagFromModal(enc){closeModal();const t=decodeURIComponent(enc);selTag.add(t);page=1;applyFilter();renderChips();toast('已筛选标签：'+t);}
function authorFromModal(enc){closeModal();const a=decodeURIComponent(enc);selAuthor.add(a);page=1;applyFilter();renderChips();toast('已筛选作者：'+a);}

// ── 标签编辑 ──
let tagEditorState={suggestions:[]};
function renderTagEditor(){
  const c=curComic;if(!c)return;
  const tags=Array.isArray(c.tags)?c.tags:[];
  const box=$('m-tags-box');
  if(!box)return;
  const sugHtml=(tagEditorState.suggestions||[])
    .filter(s=>!tags.includes(s))
    .slice(0,12)
    .map(s=>'<span class="tag-sug" onclick="addTag(\''+encArg(s)+'\')">+'+esc(s)+'</span>').join('');
  box.innerHTML=
    '<input class="tag-edit-input" id="tag-new-input" placeholder="输入标签，回车添加" value="" '+
    'onkeydown="if(event.key===\'Enter\'){event.preventDefault();addTagFromInput();}">'+
    '<div class="m-tags" id="tag-edit-list">'+tags.map((t,i)=>
      '<span class="m-tag" style="cursor:default">'+esc(t)+
      '<span style="cursor:pointer;margin-left:6px;color:var(--rose)" onclick="removeTag('+i+')" title="删除">✕</span></span>'
    ).join('')+'</div>'+
    (sugHtml?'<div style="margin-top:8px">'+sugHtml+'</div>':'')+
    '<div class="tag-edit-hint" style="margin-top:8px">点击 ✕ 删除标签；回车添加新标签；下方灰色词为其他漫画常用标签，点击直接添加。</div>'+
    '<div class="tag-edit-row">'+
      '<button class="tag-edit-btn" onclick="cancelTagEditor()">取消</button>'+
      '<button class="tag-edit-btn primary" onclick="saveTagEditor()">保存</button>'+
    '</div>';
  const inp=$('tag-new-input');if(inp)inp.focus();
}
function openTagEditor(){
  // 载入常用标签建议（从当前统计取 top 标签）
  if(!tagEditorState.suggestions.length){
    fetch('/api/comics/stats').then(r=>r.json()).then(d=>{
      tagEditorState.suggestions=(d.tags||[]).map(t=>t.name);
      renderTagEditor();
    }).catch(()=>renderTagEditor());
  }else renderTagEditor();
}
function addTagFromInput(){
  const inp=$('tag-new-input');if(!inp)return;
  const t=inp.value.trim();if(!t)return;
  if(!curComic.tags)curComic.tags=[];
  if(!curComic.tags.includes(t))curComic.tags.push(t);
  inp.value='';renderTagEditor();
}
function addTag(enc){
  const t=decodeURIComponent(enc);
  if(!curComic.tags)curComic.tags=[];
  if(!curComic.tags.includes(t))curComic.tags.push(t);
  renderTagEditor();
}
function removeTag(i){
  if(!curComic.tags)return;
  curComic.tags.splice(i,1);
  renderTagEditor();
}
function cancelTagEditor(){
  renderTagsStatic();
}
function renderTagsStatic(){
  const c=curComic;if(!c)return;
  const box=$('m-tags-box');if(!box)return;
  const tags=Array.isArray(c.tags)?c.tags:[];
  box.innerHTML=tags.map(t=>'<span class="m-tag" onclick="tagFromModal(\''+encArg(t)+'\')">'+esc(t)+'</span>').join('')||'<span style="color:var(--faint);font-size:12px">无标签</span>';
}
async function saveTagEditor(){
  const c=curComic;if(!c)return;
  const tags=Array.isArray(c.tags)?c.tags:[];
  const btn=document.querySelector('.tag-edit-btn.primary');
  if(btn){btn.disabled=true;btn.textContent='保存中…';}
  try{
    const r=await fetch('/api/comics?id='+c.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({tags})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||r.status);
    toast('标签已保存');
    renderTagsStatic();
    // 同步 ALL 里的数据
    const inAll=ALL.find(x=>x.id===c.id);
    if(inAll)inAll.tags=tags.slice();
    // 更新筛选统计
    rebuildFacets();
  }catch(e){
    toast('保存失败：'+e.message);
    renderTagEditor();
  }
  if(btn){btn.disabled=false;btn.textContent='保存';}
}
function closeModal(){curComic=null;$('modal-overlay').style.display='none';}

// ── 管理 / 选择 / 隐藏 / 隐藏区 ──
async function toggleHidden(){
  hiddenMode=!hiddenMode;
  const b=$('hbtn');
  b.classList.toggle('on',hiddenMode);
  b.textContent=hiddenMode?'返回书架':'隐藏区';
  if(hiddenMode){
    if(!HIDDEN.length){
      $('status').textContent='载入隐藏区…';
      try{
        const r=await fetch('/api/comics/hidden');
        const d=await r.json();
        HIDDEN=(d.comics||[]).map(c=>{if(!Array.isArray(c.tags)){try{c.tags=JSON.parse(c.tags||'[]');}catch(e){c.tags=[];}}return c;});
      }catch(e){
        toast('隐藏区加载失败：'+e.message);
        hiddenMode=false;b.classList.remove('on');b.textContent='隐藏区';
        return;
      }
    }
    rebuildFacets(HIDDEN);
  }else{
    // 返回书架：重新拉取可见数据（恢复的可能已回来）
    try{
      const r=await fetch('/api/comics');
      const d=await r.json();
      ALL=d.comics;
    }catch(e){}
    rebuildFacets();
  }
  selected.clear();
  // 切换视图时清空筛选，避免标签/作者集合错位
  selAuthor.clear();selTag.clear();searchQ='';favOnly=false;
  $('sb').value='';
  updateDelBar();
  page=1;
  applyFilter();
}
function toggleManage(){
  manage=!manage;
  document.body.classList.toggle('manage',manage);
  const b=$('mng-btn');
  b.classList.toggle('on',manage);
  b.textContent=manage?'退出管理':'管理';
  if(!manage){selected.clear();updateDelBar();}
  renderGrid();
}
function toggleSelect(id){
  id=String(id);
  selected.has(id)?selected.delete(id):selected.add(id);
  updateDelBar();
  const cb=document.querySelector('.cd[data-id="'+id+'"] input[type=checkbox]');
  if(cb)cb.checked=selected.has(id);
}
function clearSelection(){selected.clear();updateDelBar();syncCheckboxes();}
function syncCheckboxes(){document.querySelectorAll('.cd input[type=checkbox]').forEach(cb=>{cb.checked=selected.has(cb.dataset.id);});}
function selectAllFiltered(){filtered.forEach(c=>selected.add(String(c.id)));updateDelBar();syncCheckboxes();toast('已选 '+selected.size+' 册');}
function updateDelBar(){
  const bar=$('del-bar');
  $('del-cnt').textContent='已选 '+selected.size+' 册';
  $('del-go-btn').textContent=hiddenMode?'恢复选中':'隐藏选中';
  bar.style.display=(manage&&selected.size)?'flex':'none';
}
function showDeleteModal(){
  if(!selected.size)return;
  const btn=$('del-confirm-btn');btn.disabled=false;btn.textContent=hiddenMode?'确认恢复':'确认隐藏';
  $('del-verb').textContent=hiddenMode?'恢复':'隐藏';
  const list=$('del-list');list.innerHTML='';
  let count=0, favCnt=0;
  const src=hiddenMode?HIDDEN:ALL;
  for(const c of src){
    if(selected.has(String(c.id))){
      count++;
      const isFav=favs.has(c.id);
      if(isFav)favCnt++;
      const li=document.createElement('li');
      li.textContent='#'+c.id+' '+(c.title_cn||c.title_original||'?');
      if(isFav){li.style.color='var(--rose)';li.textContent+='（收藏·自动跳过）';}
      list.appendChild(li);
      if(count>50){const more=document.createElement('li');more.textContent='… 还有 '+(selected.size-50)+' 册';more.style.color='var(--rose)';list.appendChild(more);break;}
    }
  }
  $('del-count').textContent=selected.size;
  $('del-status').textContent=hiddenMode?'':(favCnt?'⚠ 其中 '+favCnt+' 册是收藏，确认后将自动跳过，实际隐藏 '+(selected.size-favCnt)+' 册':'');
  $('del-overlay').style.display='flex';
}
function closeDelModal(){$('del-overlay').style.display='none';}
async function confirmDelete(){
  if(hiddenMode){confirmRestore();return;}
  const btn=$('del-confirm-btn');
  btn.disabled=true;btn.textContent='处理中…';
  const ids=[...selected];
  // 收藏的漫画不可被隐藏——自动跳过（前端过滤 + 服务端强制双重保护）
  const toDel=ids.filter(id=>!favs.has(parseInt(id)));
  const favSkipped=ids.length-toDel.length;
  let apiSkipped=0;
  try{
    // 批量提交（分块, 每块 500 条）——避免超大列表单请求超限
    const items=toDel.map(id=>{
      const c=ALL.find(x=>String(x.id)===id);
      return {comic_id:parseInt(id),title:c?(c.title_cn||c.title_original||''):'',
              telegraph_url:c?(c.telegraph_url||''):'',telegram_url:c?(c.telegram_url||''):''};
    });
    let totalHidden=0, totalSkipped=0;
    const CHUNK=500;
    for(let i=0;i<items.length;i+=CHUNK){
      const chunk=items.slice(i,i+CHUNK);
      const r=await fetch('/api/deleted',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:chunk})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok){throw new Error((d.error||r.status)+'（第 '+(i/CHUNK+1)+' 批）');}
      totalHidden+=(d.hidden||0);
      totalSkipped+=(d.skipped||0);
      chunk.forEach(it=>{if(!favs.has(it.comic_id))deletedIds.add(it.comic_id);});
    }
    apiSkipped=totalSkipped;
    const hiddenCnt=totalHidden;
    const totalSkippedAll=favSkipped+apiSkipped;
    $('del-status').textContent='✓ 已隐藏 '+hiddenCnt+' 册'+(totalSkippedAll?' · 收藏已自动跳过 '+totalSkippedAll+' 册':'');
    selected.clear();
    closeDelModal();
    rebuildFacets();
    applyFilter();
    updateDelBar();
    toast('已隐藏 '+hiddenCnt+' 册'+(totalSkippedAll?'，跳过收藏 '+totalSkippedAll+' 册':''));
  }catch(e){
    $('del-status').textContent='操作失败：'+e.message;
    btn.disabled=false;btn.textContent='确认隐藏';
  }
}
function rebuildFacets(src){
  const tc={},ac={},cc={};
  const base = src || ALL;
  base.forEach(c=>{
    if(!hiddenMode&&deletedIds.has(c.id))return;
    if(c.author)ac[c.author]=(ac[c.author]||0)+1;
    if(c.circle)cc[c.circle]=(cc[c.circle]||0)+1;
    (c.tags||[]).forEach(t=>tc[t]=(tc[t]||0)+1);
  });
  TAGS=Object.entries(tc).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count);
  AUTHORS=Object.entries(ac).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count);
  CIRCLES=Object.entries(cc).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count);
  renderChips();
}

// ── 恢复（隐藏区）──
async function confirmRestore(){
  const btn=$('del-confirm-btn');
  btn.disabled=true;btn.textContent='处理中…';
  const ids=[...selected].map(Number);
  try{
    const r=await fetch('/api/comics/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.detail||r.status);
    const restored=new Set(ids.map(String));
    const back=HIDDEN.filter(c=>restored.has(String(c.id)));
    HIDDEN=HIDDEN.filter(c=>!restored.has(String(c.id)));
    ALL=ALL.concat(back);
    ids.forEach(id=>deletedIds.delete(id));
    $('del-status').textContent='✓ 已恢复 '+ids.length+' 册';
    selected.clear();
    closeDelModal();
    rebuildFacets(hiddenMode ? HIDDEN : ALL);
    applyFilter();
    updateDelBar();
    toast('已恢复 '+ids.length+' 册');
  }catch(e){
    $('del-status').textContent='操作失败：'+e.message;
    btn.disabled=false;btn.textContent='确认恢复';
  }
}

// ── URL 状态同步 ──
function syncHash(){
  const p=new URLSearchParams();
  if(searchQ)p.set('q',searchQ);
  if(selAuthor.size)p.set('a',[...selAuthor].join(','));
  if(selCircle.size)p.set('c',[...selCircle].join(','));
  if(selTag.size)p.set('t',[...selTag].join(','));
  if(sortBy!=='new')p.set('s',sortBy);
  if(page>1)p.set('p',page);
  if(favOnly)p.set('f','1');
  history.replaceState(null,'',location.pathname+(p.toString()?'#'+p:''));
}
function readHash(){
  const h=location.hash.replace(/^#/,'');
  if(!h)return;
  const p=new URLSearchParams(h);
  if(p.get('q')){searchQ=p.get('q');$('sb').value=searchQ;}
  (p.get('a')||'').split(',').filter(Boolean).forEach(x=>selAuthor.add(decodeURIComponent(x)));
  (p.get('c')||'').split(',').filter(Boolean).forEach(x=>selCircle.add(decodeURIComponent(x)));
  (p.get('t')||'').split(',').filter(Boolean).forEach(x=>selTag.add(decodeURIComponent(x)));
  if(p.get('s')){sortBy=p.get('s');$('sort').value=sortBy;}
  if(p.get('p'))page=parseInt(p.get('p'))||1;
  if(p.get('f')==='1')favOnly=true;
}

// ── 数据加载 ──
async function loadViaAPI(){
  $('status').textContent='载入中…';
  const r1=await fetch('/api/comics/stats');
  const d1=await r1.json();
  TAGS=d1.tags;AUTHORS=d1.authors;CIRCLES=d1.circles||[];
  const r2=await fetch('/api/comics');
  const d2=await r2.json();
  ALL=d2.comics;
}
function applyData(d){
  ALL=d.comics;TAGS=d.tags;AUTHORS=d.authors;CIRCLES=d.circles||[];
}
function finishLoad(){
  ALL.forEach(c=>{if(!Array.isArray(c.tags)){try{c.tags=JSON.parse(c.tags||'[]');}catch(e){c.tags=[];}}});
  $('total-badge').textContent=ALL.length.toLocaleString();
  updateFavCount();updateTopBtns();
  renderChips();applyFilter();
}

(async function(){
  skeletons();
  readHash();
  try{
    await loadViaAPI();
    await loadPikPakRecords();
    await loadDeletedComics();
    await loadFavs();
    finishLoad();
    return;
  }catch(e){console.log('D1 API error, fallback to comics.json',e);}
  try{
    $('status').textContent='接口不可用，回退静态数据…';
    const r=await fetch('comics.json?'+Date.now());
    const d=await r.json();
    applyData(d);
    await loadPikPakRecords();
    await loadDeletedComics();
    finishLoad();
  }catch(e){
    $('g').innerHTML='<div class="empty" style="grid-column:1/-1"><span class="e-t">载入失败</span><small>'+esc(e.message)+'</small></div>';
  }
})();

// ── 已隐藏记录 ──
async function loadDeletedComics(){
  try{
    const r=await fetch('/api/deleted');
    const d=await r.json();
    deletedIds=new Set();
    if(d.deleted)d.deleted.forEach(rec=>deletedIds.add(rec.comic_id));
  }catch(e){console.log('load deleted error',e);}
}

// ── PikPak ──
async function loadPikPakRecords(){
  try{
    const r=await fetch('/api/records');
    const d=await r.json();
    gPikPakState={};
    if(d.records)d.records.forEach(rec=>{
      gPikPakState[rec.comic_id]={status:'completed',share_url:rec.share_url,progress:'完成',title:rec.title,downloaded:rec.pages};
    });
  }catch(e){console.log('D1 load error',e);gPikPakState={};}
}
async function savePikPakRecord(id,data){
  if(!data||data.status!=='completed'||!data.share_url)return;
  try{
    await fetch('/api/records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({comic_id:id,share_url:data.share_url,title:data.title||'',pages:data.downloaded||0})});
  }catch(e){console.log('D1 save error',e);}
}
function refreshPikPakButtons(){
  document.querySelectorAll('.lb[data-comic-id]').forEach(el=>updatePikPakBtn(el));
}
function updatePikPakBtn(el){
  const id=el.dataset.comicId;
  if(!id||!el.dataset.url){el.style.display='none';return;}
  el.style.display='';
  const s=gPikPakState[id];
  if(s&&s.status==='completed'){
    el.style.color='var(--rose)';
    el.textContent='阅读 ✓';el.onclick=()=>window.open(s.share_url,'_blank');
  }else if(s&&(s.status==='loading'||s.status==='queued')){
    el.style.color='var(--muted)';
    el.textContent='下载中 '+(s.progress||'…');el.onclick=null;
  }else if(s&&s.status==='error'){
    el.style.color='var(--rose)';
    el.textContent='重试';el.onclick=()=>handlePikPakClick(el);
  }else{
    el.style.color='var(--paper)';
    el.textContent='PikPak 下载';el.onclick=()=>handlePikPakClick(el);
  }
}
async function handlePikPakClick(el){
  const id=el.dataset.comicId;
  if(!id||!el.dataset.url)return;
  const s=gPikPakState[id];
  if(s&&s.status==='completed'&&s.share_url){window.open(s.share_url,'_blank');return;}
  if(s&&(s.status==='queued'||s.status==='loading'))return;

  gPikPakState[id]={status:'loading',progress:'连接中…'};
  updatePikPakBtn(el);
  try{
    const r=await fetch(API_BASE+'/api/download',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-DL-Token':DL_TOKEN},
      body:JSON.stringify({
        telegraph_url:el.dataset.url,
        title_cn:el.dataset.title,
        title_original:el.dataset.titleOrig,
        comic_id:id,
        pages:parseInt(el.dataset.pages)||0
      })
    });
    const d=await r.json();
    if(!d.task_id)throw new Error(d.error||'服务器返回异常');

    gPikPakState[id]={status:'loading',progress:'排队中…',taskId:d.task_id};
    updatePikPakBtn(el);

    let waited=0;
    const maxWait=600;
    const timer=setInterval(async()=>{
      try{
        const pr=await fetch(API_BASE+'/api/download/'+d.task_id,{headers:{'X-DL-Token':DL_TOKEN}});
        const pd=await pr.json();
        waited+=3;
        if(pd.status==='completed'){
          clearInterval(timer);
          gPikPakState[id]={status:'completed',share_url:pd.share_url||'',progress:'完成',title:el.dataset.title,downloaded:pd.downloaded};
          savePikPakRecord(id,gPikPakState[id]);
          updatePikPakBtn(el);
          toast('已保存到 PikPak，点击可阅读');
        }else if(pd.status==='error'){
          clearInterval(timer);
          gPikPakState[id]={status:'error',progress:pd.progress||'下载失败'};
          updatePikPakBtn(el);
          toast('下载失败，可重试');
        }else if(waited>maxWait){
          clearInterval(timer);
          gPikPakState[id]={status:'error',progress:'超时'};
          updatePikPakBtn(el);
          toast('下载超时，稍后重试');
        }else{
          gPikPakState[id]={status:'loading',progress:pd.progress||'下载中…',taskId:d.task_id};
          updatePikPakBtn(el);
        }
      }catch(e){/* 轮询失败，重试 */ }
    },3000);
  }catch(e){
    gPikPakState[id]={status:'error',progress:e.message};
    updatePikPakBtn(el);
    toast('无法连接下载服务器');
  }
}
