<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🌈 Comic Gallery</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
<style>
:root{
  --bg:#0c0a12; --surface:#171326; --surface2:#1e1932; --surface3:#241e3d;
  --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.14);
  --text:#ece7f5; --muted:#a29bb8; --dim:#6f6890;
  --amber:#f5a524; --amber2:#ffc24d; --purple:#a78bfa;
  --green:#34d399; --red:#f87171; --blue:#60a5fa;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(1100px 550px at 85% -10%, rgba(167,139,250,.12), transparent 60%),
    radial-gradient(900px 500px at -10% 15%, rgba(245,165,36,.08), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  min-height:100vh;
}
/* ── Top bar ── */
.top{position:sticky;top:0;z-index:100;background:rgba(12,10,18,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.top-in{max-width:1440px;margin:auto;display:flex;align-items:center;gap:14px;padding:12px 18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-size:1.15rem;cursor:pointer;user-select:none;white-space:nowrap}
.logo b{background:linear-gradient(90deg,var(--amber),var(--amber2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.badge{background:var(--surface3);color:var(--muted);font-size:.68rem;padding:2px 9px;border-radius:99px;border:1px solid var(--border2)}
.search-wrap{flex:1;min-width:220px;max-width:560px;position:relative;display:flex;align-items:center}
.s-ico{position:absolute;left:12px;font-size:.85rem;opacity:.6;pointer-events:none}
.sb{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:99px;padding:9px 34px 9px 36px;color:var(--text);font-size:.88rem;outline:none;transition:border-color .2s,box-shadow .2s}
.sb:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,165,36,.15)}
.sb::placeholder{color:var(--dim)}
.s-clear{position:absolute;right:8px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:.8rem;padding:4px 6px;border-radius:50%;display:none}
.s-clear:hover{color:var(--text);background:var(--surface3)}
.top-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.tbtn{background:var(--surface);color:var(--muted);border:1px solid var(--border2);padding:7px 13px;border-radius:99px;cursor:pointer;font-size:.78rem;white-space:nowrap;transition:all .18s}
.tbtn:hover{color:var(--text);border-color:var(--amber);transform:translateY(-1px)}
.tbtn.on{background:var(--amber);color:#1a1206;border-color:var(--amber);font-weight:700}
.tbtn.warn.on{background:var(--red);color:#fff;border-color:var(--red)}
/* ── Filters ── */
.filters{max-width:1440px;margin:auto;padding:10px 18px 0}
.f-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.f-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface3);border:1px solid var(--border2);color:var(--text);font-size:.75rem;padding:4px 8px 4px 12px;border-radius:99px}
.f-chip button{background:none;border:none;color:var(--dim);cursor:pointer;font-size:.85rem;line-height:1;padding:2px}
.f-chip button:hover{color:var(--red)}
.f-clear{background:none;border:none;color:var(--amber);font-size:.75rem;cursor:pointer;padding:4px 6px}
.f-clear:hover{text-decoration:underline}
.f-sec{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden}
.f-sec summary{cursor:pointer;padding:9px 14px;font-size:.8rem;color:var(--muted);font-weight:600;list-style:none;display:flex;align-items:center;gap:8px;user-select:none}
.f-sec summary::-webkit-details-marker{display:none}
.f-sec summary::before{content:"▸";color:var(--dim);transition:transform .2s;font-size:.7rem}
.f-sec[open] summary::before{transform:rotate(90deg)}
.f-sec summary .n{color:var(--amber);font-weight:700}
.f-sec summary:hover{background:var(--surface2)}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:2px 12px 12px;max-height:150px;overflow-y:auto}
.chip{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:3px 10px;border-radius:99px;cursor:pointer;font-size:.72rem;white-space:nowrap;transition:all .15s}
.chip:hover{color:var(--amber);border-color:var(--amber)}
.chip.on{background:rgba(245,165,36,.15);color:var(--amber);border-color:var(--amber);font-weight:600}
/* ── Main ── */
main{max-width:1440px;margin:auto;padding:14px 18px 30px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:.8rem}
.sort{background:var(--surface);color:var(--text);border:1px solid var(--border2);border-radius:8px;padding:6px 10px;font-size:.78rem;outline:none;cursor:pointer}
.sort:focus{border-color:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
/* Card */
.cd{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;position:relative;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;display:flex;flex-direction:column}
.cd:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.55),0 0 0 1px rgba(245,165,36,.28);border-color:rgba(245,165,36,.35)}
.cvw{position:relative;overflow:hidden;aspect-ratio:3/4;background:linear-gradient(150deg,var(--surface3),var(--surface))}
.cvw .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.4rem;opacity:.35;background:linear-gradient(150deg,#2a2347,#171326)}
.cv{position:relative;width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.cd:hover .cv{transform:scale(1.06)}
.cb-wrap{position:absolute;top:8px;left:8px;z-index:3;display:none}
body.manage .cb-wrap{display:block}
.cb-wrap input{width:19px;height:19px;cursor:pointer;accent-color:var(--amber)}
.fav{position:absolute;top:6px;right:6px;z-index:3;background:rgba(12,10,18,.55);border:1px solid var(--border2);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.95rem;color:var(--muted);backdrop-filter:blur(4px);transition:all .18s;opacity:0}
.cd:hover .fav,.fav.on{opacity:1}
.fav:hover{transform:scale(1.12);border-color:var(--amber)}
.fav.on{color:var(--amber);text-shadow:0 0 10px rgba(245,165,36,.6)}
.if{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.tt{font-size:.82rem;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tt.cn{color:var(--text)}
.tt.rw{color:var(--dim);font-size:.7rem;font-weight:400;-webkit-line-clamp:1}
.mt{color:var(--dim);font-size:.68rem;display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.mt span{display:inline-flex;align-items:center;gap:3px}
.tr{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;max-height:0;overflow:hidden;transition:max-height .25s ease}
.cd:hover .tr,.cd:focus-within .tr{max-height:52px}
.ta{background:var(--surface2);color:var(--muted);padding:2px 8px;border-radius:6px;font-size:.65rem;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.ta.au{background:rgba(245,165,36,.12);color:var(--amber)}
.lk{display:flex;gap:6px;margin-top:8px}
.lb{flex:1;text-align:center;padding:6px 4px;border-radius:8px;text-decoration:none;font-size:.7rem;font-weight:600;transition:all .18s;border:1px solid transparent}
.lb.tp{background:rgba(245,165,36,.12);color:var(--amber);border-color:rgba(245,165,36,.3)}
.lb.tp:hover{background:var(--amber);color:#1a1206;transform:translateY(-1px)}
.lb.tg{background:rgba(96,165,250,.1);color:var(--blue);border-color:rgba(96,165,250,.3)}
.lb.tg:hover{background:var(--blue);color:#fff;transform:translateY(-1px)}
/* Skeleton */
.sk{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.sk-cover{aspect-ratio:3/4;background:linear-gradient(100deg,var(--surface) 40%,var(--surface3) 50%,var(--surface) 60%);background-size:200% 100%;animation:shimmer 1.4s infinite}
.sk-line{height:10px;margin:10px 12px 0;border-radius:5px;background:linear-gradient(100deg,var(--surface) 40%,var(--surface3) 50%,var(--surface) 60%);background-size:200% 100%;animation:shimmer 1.4s infinite}
.sk-line.w50{width:50%;margin-bottom:14px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* Pagination */
.pag{display:flex;justify-content:center;gap:5px;margin-top:22px;flex-wrap:wrap}
.pb{background:var(--surface);color:var(--muted);border:1px solid var(--border2);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:.78rem;min-width:36px;text-align:center;transition:all .15s}
.pb:hover{color:var(--amber);border-color:var(--amber)}
.pb.on{background:var(--amber);color:#1a1206;border-color:var(--amber);font-weight:700}
.pb:disabled{opacity:.35;cursor:default}
.pb:disabled:hover{color:var(--muted);border-color:var(--border2)}
.pb-dot{align-self:center;color:var(--dim);font-size:.75rem;padding:0 2px}
.foot{max-width:1440px;margin:auto;padding:20px 18px 60px;text-align:center;color:var(--dim);font-size:.72rem}
/* ── Delete bar ── */
#del-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(23,19,38,.95);backdrop-filter:blur(12px);border-top:1px solid var(--red);padding:12px 18px;display:none;align-items:center;gap:12px;z-index:150;font-size:.85rem;flex-wrap:wrap}
#del-bar .cnt{color:var(--text);flex:1;min-width:120px}
.del-cancel{background:var(--surface2);color:var(--muted);border:1px solid var(--border2);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.78rem}
.del-cancel:hover{color:var(--text)}
.del-go{background:var(--red);color:#fff;border:none;padding:8px 20px;border-radius:8px;cursor:pointer;font-weight:700;font-size:.8rem}
.del-go:hover{background:#ef4444}
/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(6,5,10,.75);backdrop-filter:blur(6px);z-index:200;display:none;align-items:center;justify-content:center;padding:18px}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:18px;max-width:680px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal::-webkit-scrollbar{width:8px}
.modal::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:4px}
.m-head{display:flex;gap:18px;padding:20px;flex-wrap:wrap}
.m-cover{width:190px;border-radius:12px;overflow:hidden;border:1px solid var(--border2);flex-shrink:0;aspect-ratio:3/4;background:var(--surface2)}
.m-cover img{width:100%;height:100%;object-fit:cover;display:block}
.m-info{flex:1;min-width:230px}
.m-info h2{font-size:1.05rem;line-height:1.4;margin-bottom:4px}
.m-info .m-orig{color:var(--dim);font-size:.8rem;margin-bottom:10px;word-break:break-all}
.m-meta{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:.78rem;margin-bottom:12px}
.m-meta b{color:var(--amber);font-weight:600}
.m-sec{font-size:.7rem;color:var(--dim);font-weight:700;letter-spacing:.06em;margin:12px 0 6px}
.m-tags{display:flex;flex-wrap:wrap;gap:6px}
.m-tag{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:4px 12px;border-radius:99px;cursor:pointer;font-size:.75rem;transition:all .15s}
.m-tag:hover{color:var(--amber);border-color:var(--amber)}
.m-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.m-actions .lb{flex:1;min-width:110px;padding:10px 6px;font-size:.8rem}
.m-fav{margin-top:10px;width:100%;background:var(--surface2);color:var(--muted);border:1px solid var(--border2);padding:9px;border-radius:10px;cursor:pointer;font-size:.8rem;transition:all .18s}
.m-fav:hover{border-color:var(--amber);color:var(--text)}
.m-fav.on{background:rgba(245,165,36,.12);color:var(--amber);border-color:var(--amber)}
/* Delete confirm modal */
.del-modal{padding:22px;max-width:440px;width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.del-modal h3{color:var(--red);margin-bottom:10px;font-size:1rem}
.del-modal p{color:var(--muted);font-size:.8rem;margin-bottom:8px;line-height:1.5}
.del-list{background:var(--bg);border-radius:10px;padding:10px 14px;max-height:190px;overflow-y:auto;margin:10px 0;font-size:.75rem;color:var(--text);list-style:none}
.del-list li{padding:4px 0;border-bottom:1px solid var(--border)}
.del-list li:last-child{border-bottom:none}
.del-status{color:var(--amber);font-size:.8rem;min-height:1.2em}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row button{flex:1;padding:10px;border-radius:10px;border:none;cursor:pointer;font-weight:600;font-size:.85rem}
/* Toast */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--surface3);color:var(--text);padding:10px 22px;border-radius:99px;font-size:.8rem;border:1px solid var(--border2);box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:all .3s ease;z-index:300;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* To top */
.totop{position:fixed;right:22px;bottom:26px;width:44px;height:44px;border-radius:50%;background:var(--surface3);color:var(--amber);border:1px solid var(--border2);cursor:pointer;font-size:1.1rem;opacity:0;pointer-events:none;transition:all .25s;z-index:120;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.totop.show{opacity:1;pointer-events:auto}
.totop:hover{background:var(--amber);color:#1a1206;transform:translateY(-3px)}
#error{text-align:center;padding:60px 20px;color:var(--red)}
.empty{text-align:center;padding:80px 20px;color:var(--dim)}
.empty .e-ico{font-size:3rem;display:block;margin-bottom:14px;opacity:.5}
/* Scrollbar */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2c2547;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#3a3158}
@media(max-width:640px){
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .m-cover{width:100%;max-width:240px;margin:auto}
  .top-in{gap:8px}
  .logo{font-size:1rem}
  .search-wrap{order:3;max-width:none;flex-basis:100%}
  .badge{display:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="logo" onclick="resetAll()">🌈 <b>Comic Gallery</b><span class="badge" id="total-badge">加载中…</span></div>
    <div class="search-wrap">
      <span class="s-ico">🔍</span>
      <input id="sb" class="sb" placeholder="搜索标题 / 作者 / 标签…" autocomplete="off">
      <button class="s-clear" id="s-clear" onclick="clearSearch()">✕</button>
    </div>
    <div class="top-actions">
      <button class="tbtn" id="fav-btn" onclick="toggleFavOnly()" title="只看收藏">❤ <span id="fav-n">0</span></button>
      <button class="tbtn" id="orig-btn" onclick="tg()" title="切换中文/原标题显示">显示原标题</button>
      <button class="tbtn warn" id="mng-btn" onclick="toggleManage()">☰ 管理</button>
    </div>
  </div>
</header>

<div class="filters">
    <div class="f-row" id="active-filters" style="display:none"></div>
    <details class="f-sec" id="author-sec" open>
      <summary>👤 作者 <span class="n" id="acnt">0</span></summary>
      <div class="chips" id="ab"></div>
    </details>
    <details class="f-sec" id="tag-sec">
      <summary>🏷 分类 <span class="n" id="tcnt">0</span></summary>
      <div class="chips" id="cb"></div>
    </details>
</div>

<main>
  <div class="bar">
    <span class="cnt" id="status">加载中…</span>
    <select id="sort" class="sort" onchange="setSort(this.value)" title="排序方式">
      <option value="new">🕐 最新发布</option>
      <option value="old">🕐 最早发布</option>
      <option value="stars">⭐ 评分最高</option>
      <option value="pages">📄 页数最多</option>
    </select>
  </div>
  <div class="grid" id="g"></div>
  <div class="pag" id="pag" style="display:none"></div>
</main>

<footer class="foot">数据源 comic.labs.gay · 每日 6:00 自动同步 · 点击卡片查看详情 · 管理模式可批量删除</footer>

<div id="del-bar">
  <span class="cnt" id="del-cnt">已选择 0 本</span>
  <button class="del-cancel" onclick="selectAllFiltered()">✅ 全选当前筛选</button>
  <button class="del-cancel" onclick="clearSelection()">取消</button>
  <button class="del-go" onclick="showDeleteModal()">🗑 删除选中</button>
</div>

<!-- Detail modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="detail-modal"></div>
</div>

<!-- Delete confirm modal -->
<div class="modal-overlay" id="del-overlay" onclick="if(event.target===this)closeDelModal()">
  <div class="del-modal">
    <h3>🗑 确认删除</h3>
    <p>将从显示中永久隐藏以下 <b id="del-count" style="color:var(--red)">0</b> 本漫画（数据存在 D1，可恢复）：</p>
    <ul class="del-list" id="del-list"></ul>
    <div class="del-status" id="del-status"></div>
    <div class="btn-row">
      <button style="background:var(--surface2);color:var(--muted)" onclick="closeDelModal()">取消</button>
      <button id="del-confirm-btn" style="background:var(--red);color:#fff" onclick="confirmDelete()">确认删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<button class="totop" id="totop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
'use strict';
const $=id=>document.getElementById(id);

// ── Global state ──
let ALL=[], TAGS=[], AUTHORS=[];
let searchQ='', selAuthor=new Set(), selTag=new Set(), favOnly=false, showOrig=false;
let sortBy='new', page=1, perPage=24, totalPages=1;
let manage=false, filtered=[], selected=new Set(), deletedIds=new Set();
let favs=new Set(JSON.parse(localStorage.getItem('cg_favs')||'[]'));
let gPikPakState={};

// PikPak download server (local tunnel). Change to '' to use Pages Function.
const API_BASE='https://not-establishment-ebooks-ourselves.trycloudflare.com';

function esc(s){const d=document.createElement('div');d.textContent=(s==null?'':String(s));return d.innerHTML;}
function fmtDate(s){if(!s)return '?';const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[1]+'-'+m[2]+'-'+m[3]:s.slice(0,10);}
function saveFavs(){localStorage.setItem('cg_favs',JSON.stringify([...favs]));}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);}

// ── Card rendering ──
function renderCard(c){
  const cd=document.createElement('div');
  cd.className='cd';cd.dataset.id=c.id;
  // checkbox (manage mode)
  const cbw=document.createElement('div');cbw.className='cb-wrap';
  const cb=document.createElement('input');cb.type='checkbox';cb.dataset.id=c.id;
  cb.checked=selected.has(String(c.id));
  cb.addEventListener('click',e=>{e.stopPropagation();toggleSelect(c.id);});
  cbw.appendChild(cb);cd.appendChild(cbw);
  // cover
  const cvw=document.createElement('div');cvw.className='cvw';
  const ph=document.createElement('div');ph.className='ph';ph.textContent='📖';cvw.appendChild(ph);
  const img=document.createElement('img');img.className='cv';img.loading='lazy';img.alt=c.title_cn||'';
  img.src=c.cover_url;img.onerror=function(){this.style.display='none';};
  cvw.appendChild(img);cd.appendChild(cvw);
  // favorite
  const fav=document.createElement('div');fav.className='fav'+(favs.has(c.id)?' on':'');fav.textContent='❤';
  fav.title='收藏';fav.addEventListener('click',e=>{e.stopPropagation();toggleFav(c.id);});
  cvw.appendChild(fav);
  // info
  const di=document.createElement('div');di.className='if';
  const cn=document.createElement('div');cn.className='tt cn';cn.textContent=c.title_cn||'?';di.appendChild(cn);
  if(c.title_original){const rw=document.createElement('div');rw.className='tt rw';rw.textContent=c.title_original;di.appendChild(rw);}
  const mt=document.createElement('div');mt.className='mt';
  mt.innerHTML='<span>📅 '+esc(fmtDate(c.published_at))+'</span><span>📄 '+esc(c.pages||0)+'P</span><span>⭐ '+esc(c.stars||0)+'</span>';

// ── Filtering & sorting ──
function applyFilter(){
  const q=searchQ.toLowerCase();
  filtered=ALL.filter(c=>{
    if(deletedIds.has(c.id))return false;
    if(favOnly&&!favs.has(c.id))return false;
    if(selAuthor.size&&!selAuthor.has(c.author))return false;
    if(selTag.size&&!c.tags.some(t=>selTag.has(t)))return false;
    if(q){
      const kws=q.split(/\s+/).filter(Boolean);
      for(const kw of kws){
        const inT=(c.title_cn&&c.title_cn.toLowerCase().includes(kw))||(c.title_original&&c.title_original.toLowerCase().includes(kw));
        const inA=c.author&&c.author.toLowerCase().includes(kw);
        const inTags=c.tags.some(t=>t.toLowerCase().includes(kw));
        if(!inT&&!inA&&!inTags)return false;
      }
    }
    return true;
  });
  // sort
  filtered.sort((a,b)=>{
    if(sortBy==='old')return (a.published_at||'').localeCompare(b.published_at||'')||a.id-b.id;
    if(sortBy==='stars')return (parseFloat(b.stars)||0)-(parseFloat(a.stars)||0);
    if(sortBy==='pages')return (b.pages||0)-(a.pages||0);
    return (b.published_at||'').localeCompare(a.published_at||'')||b.id-a.id;
  });
  totalPages=Math.max(1,Math.ceil(filtered.length/perPage));
  if(page>totalPages)page=totalPages;
  const shown=Math.min(filtered.length,perPage);
  $('status').textContent='显示 '+shown.toLocaleString()+' / '+filtered.length.toLocaleString()+' 本（共 '+ALL.length.toLocaleString()+' 本）';
  renderGrid();
  renderActiveFilters();
  updateDelBar();
  syncHash();
}

    const b=document.createElement('button');b.className='chip'+(selAuthor.has(a.name)?' on':'');
    b.textContent=a.name+' ('+a.count+')';
    b.onclick=()=>{selAuthor.has(a.name)?selAuthor.delete(a.name):selAuthor.add(a.name);page=1;applyFilter();renderChips();};
    ab.appendChild(b);
  });
  TAGS.forEach(t=>{
    const b=document.createElement('button');b.className='chip'+(selTag.has(t.name)?' on':'');
    b.textContent=t.name+' ('+t.count+')';
    b.onclick=()=>{selTag.has(t.name)?selTag.delete(t.name):selTag.add(t.name);page=1;applyFilter();renderChips();};
    cb.appendChild(b);
  });
  $('acnt').textContent=selAuthor.size+'/'+AUTHORS.length;
  $('tcnt').textContent=selTag.size+'/'+TAGS.length;
}

function renderPagination(){
  const tp=totalPages;
  const nav=(p)=>'<button class="pb" '+(p<1||p>tp?'disabled':'onclick="goPage('+p+')"')+'>'+(p===1?'‹':p===tp?'›':'')+'</button>';
  let h='<button class="pb" '+(page<=1?'disabled':'onclick="goPage('+(page-1)+')"')+'>‹</button>';
  const s=Math.max(1,page-4),e=Math.min(tp,page+4);
  if(s>1){h+='<button class="pb" onclick="goPage(1)">1</button>';if(s>2)h+='<span class="pb-dot">…</span>';}
  for(let i=s;i<=e;i++)h+='<button class="pb'+(i===page?' on':'')+'" onclick="goPage('+i+')">'+i+'</button>';
  if(e<tp){if(e<tp-1)h+='<span class="pb-dot">…</span>';h+='<button class="pb" onclick="goPage('+tp+')">'+tp+'</button>';}
  h+='<button class="pb" '+(page>=tp?'disabled':'onclick="goPage('+(page+1)+')"')+'>›</button>';
  $('pag').innerHTML=h;
}

async function confirmDelete(){
  const btn=$('del-confirm-btn');
  btn.disabled=true;btn.textContent='删除中…';
  const ids=[...selected];
  try{
    for(const id of ids){
      const c=ALL.find(x=>String(x.id)===id);
      await fetch('/api/deleted',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({comic_id:parseInt(id),title:c?(c.title_cn||c.title_original||''):''})});
      deletedIds.add(parseInt(id));
    }
    $('del-status').textContent='✅ 已隐藏 '+ids.length+' 本';
    selected.clear();
    closeDelModal();
    // refresh author/tag counts (client-side, excluding deleted)
    rebuildFacets();
    applyFilter();
    updateDelBar();
    toast('已删除 '+ids.length+' 本');
  }catch(e){
    $('del-status').textContent='❌ 错误: '+e.message;
    btn.disabled=false;btn.textContent='确认删除';
  }
}
function rebuildFacets(){
  const tc={},ac={};
  ALL.forEach(c=>{
    if(deletedIds.has(c.id))return;
    if(c.author)ac[c.author]=(ac[c.author]||0)+1;
    (c.tags||[]).forEach(t=>tc[t]=(tc[t]||0)+1);
  });
  TAGS=Object.entries(tc).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count);
  AUTHORS=Object.entries(ac).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count);
  renderChips();
}

// ── URL hash sync ──
function syncHash(){
  const p=new URLSearchParams();
  if(searchQ)p.set('q',searchQ);
  if(selAuthor.size)p.set('a',[...selAuthor].join(','));
  if(selTag.size)p.set('t',[...selTag].join(','));
  if(sortBy!=='new')p.set('s',sortBy);
  if(page>1)p.set('p',page);
  if(favOnly)p.set('f','1');
  history.replaceState(null,'',location.pathname+(p.toString()?'#'+p:''));
}
function readHash(){
  const h=location.hash.replace(/^#/,'');
  if(!h)return;
  const p=new URLSearchParams(h);
  if(p.get('q')){searchQ=p.get('q');$('sb').value=searchQ;}
  (p.get('a')||'').split(',').filter(Boolean).forEach(x=>selAuthor.add(decodeURIComponent(x)));
  (p.get('t')||'').split(',').filter(Boolean).forEach(x=>selTag.add(decodeURIComponent(x)));
  if(p.get('s')){sortBy=p.get('s');$('sort').value=sortBy;}
  if(p.get('p'))page=parseInt(p.get('p'))||1;
  if(p.get('f')==='1')favOnly=true;
}

async function loadPikPakRecords(){

    if(d.records)d.records.forEach(rec=>{
      gPikPakState[rec.comic_id]={status:'completed',share_url:rec.share_url,progress:'完成',title:rec.title,downloaded:rec.pages};
    });
  }catch(e){console.log('D1 load error',e);gPikPakState={};}
}
async function savePikPakRecord(id,data){
  if(!data||data.status!=='completed'||!data.share_url)return;
  try{
    await fetch('/api/records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({comic_id:id,share_url:data.share_url,title:data.title||'',pages:data.downloaded||0})});
  }catch(e){console.log('D1 save error',e);}
}
function refreshPikPakButtons(){
  document.querySelectorAll('.lb[data-comic-id]').forEach(el=>updatePikPakBtn(el));
}
function updatePikPakBtn(el){
  const id=el.dataset.comicId;
  if(!id||!el.dataset.url){el.style.display='none';return;}
  el.style.display='inline-block';
  const s=gPikPakState[id];
  if(s&&s.status==='completed'){
    el.style.background='rgba(245,165,36,.15)';el.style.color='var(--amber)';el.style.border='1px solid rgba(245,165,36,.4)';
    el.textContent='📖 阅读';el.onclick=()=>window.open(s.share_url,'_blank');
  }else if(s&&(s.status==='loading'||s.status==='queued')){
    el.style.background='rgba(180,83,9,.15)';el.style.color='var(--amber2)';el.style.border='1px solid rgba(180,83,9,.4)';
    el.textContent='📥 '+(s.progress||'下载中…');el.onclick=null;
  }else if(s&&s.status==='error'){
    el.style.background='rgba(248,113,113,.12)';el.style.color='var(--red)';el.style.border='1px solid rgba(248,113,113,.4)';
    el.textContent='❌ 重试';el.onclick=()=>handlePikPakClick(el);
  }else{
    el.style.background='rgba(52,211,153,.1)';el.style.color='var(--green)';el.style.border='1px solid rgba(52,211,153,.3)';
    el.textContent='📥 PikPak';el.onclick=()=>handlePikPakClick(el);
  }
}
async function handlePikPakClick(el){
  const id=el.dataset.comicId;
  if(!id||!el.dataset.url)return;
  const s=gPikPakState[id];
  if(s&&s.status==='completed'&&s.share_url){window.open(s.share_url,'_blank');return;}
  if(s&&(s.status==='queued'||s.status==='loading'))return;

  gPikPakState[id]={status:'loading',progress:'连接服务器…'};
  updatePikPakBtn(el);
  try{
    const r=await fetch(API_BASE+'/api/download',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        telegraph_url:el.dataset.url,
        title_cn:el.dataset.title,
        title_original:el.dataset.titleOrig,
        comic_id:id,
        pages:parseInt(el.dataset.pages)||0
      })
    });
    const d=await r.json();
    if(!d.task_id)throw new Error(d.error||'服务器返回异常');

    gPikPakState[id]={status:'loading',progress:'排队中…',taskId:d.task_id};
    updatePikPakBtn(el);

    let waited=0;
    const maxWait=600;
    const timer=setInterval(async()=>{
      try{
        const pr=await fetch(API_BASE+'/api/download/'+d.task_id);
        const pd=await pr.json();
        waited+=3;
        if(pd.status==='completed'){
          clearInterval(timer);
          gPikPakState[id]={status:'completed',share_url:pd.share_url||'',progress:'完成',title:el.dataset.title,downloaded:pd.downloaded};
          savePikPakRecord(id,gPikPakState[id]);
          updatePikPakBtn(el);
          toast('✅ 已保存到 PikPak，点击可阅读');
        }else if(pd.status==='error'){
          clearInterval(timer);
          gPikPakState[id]={status:'error',progress:pd.progress||'下载失败'};
          updatePikPakBtn(el);
          toast('❌ 下载失败');
        }else if(waited>maxWait){
          clearInterval(timer);
          gPikPakState[id]={status:'error',progress:'超时'};
          updatePikPakBtn(el);
          toast('⏱ 下载超时，请稍后重试');
        }else{
          gPikPakState[id]={status:'loading',progress:pd.progress||'下载中…',taskId:d.task_id};
          updatePikPakBtn(el);
        }
      }catch(e){/* poll error, retry */ }
    },3000);
  }catch(e){
    gPikPakState[id]={status:'error',progress:e.message};
    updatePikPakBtn(el);
    toast('❌ 无法连接下载服务器');
  }
}
</script>
</body>
</html>
