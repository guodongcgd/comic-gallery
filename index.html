<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Comic Gallery</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0c0a;color:#e7e0d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:16px;max-width:1440px;margin:auto}
h1{color:#fbbf24;font-size:1.3rem;margin:0;cursor:pointer}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.sub{color:#a8a29e;font-size:0.8rem;margin:0}
.tgbtn{background:#2a2420;color:#e7e0d9;border:1px solid #5a4a40;padding:3px 12px;border-radius:5px;cursor:pointer;font-size:0.75rem;white-space:nowrap}
.tgbtn:hover{background:#3a322e;border-color:#fbbf24}.tgbtn.on{background:#fbbf24;color:#0f0c0a;border-color:#fbbf24;font-weight:600}
.sl{color:#a8a29e;font-size:0.7rem;font-weight:600;margin:3px 0}
.fb{display:flex;flex-wrap:wrap;gap:3px;padding-bottom:6px;border-bottom:1px solid #2a2420;margin-bottom:3px;max-height:130px;overflow-y:auto}
.fb:last-of-type{margin-bottom:10px}
.tb{background:#1a1614;color:#a8a29e;border:1px solid #2a2420;padding:2px 8px;border-radius:4px;cursor:pointer;font-size:0.68rem;white-space:nowrap;margin:1px}
.tb:hover{background:#2a2420;color:#fbbf24}.tb.on{background:#fbbf24;color:#0f0c0a;border-color:#fbbf24;font-weight:600}
.cnt{color:#57534e;font-size:0.75rem;margin-bottom:8px}
.pag{display:flex;justify-content:center;gap:4px;margin-bottom:12px;padding:6px 0;border-top:1px solid #2a2420;border-bottom:1px solid #2a2420;flex-wrap:wrap}
.pb{background:#1a1614;color:#a8a29e;border:1px solid #2a2420;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:0.75rem;min-width:30px;text-align:center}
.pb:hover{background:#2a2420;color:#fbbf24}.pb.on{background:#fbbf24;color:#0f0c0a;border-color:#fbbf24;font-weight:700}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.cd{background:#1a1614;border-radius:8px;overflow:hidden;border:1px solid #2a2420;transition:border-color .2s;display:flex;flex-direction:column;position:relative}
.cd:hover{border-color:#fbbf24}
.cd.del{opacity:.4;pointer-events:none}
.cv{width:100%;aspect-ratio:1/1.4;object-fit:cover;display:block;background:#2a2420}
.if{padding:10px}
.tt{font-size:0.8rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tt.cn{color:#fbbf24}.tt.rw{color:#a8a29e;font-size:0.7rem}
.mt{color:#57534e;font-size:0.65rem;margin:4px 0}
.tr{display:flex;flex-wrap:wrap;gap:2px;margin:2px 0}
.ta{background:#2a2420;color:#a8a29e;padding:1px 5px;border-radius:3px;font-size:0.6rem;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.ta.au{background:#fbbf2415;color:#fbbf24}
.lk{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.lb{flex:1;text-align:center;padding:4px;border-radius:4px;text-decoration:none;font-size:0.65rem;font-weight:600}
.lb.tp{background:#fbbf2415;color:#fbbf24;border:1px solid #fbbf2440}.lb.tp:hover{background:#fbbf24;color:#0f0c0a}
.lb.tg{background:#1d4ed815;color:#60a5fa;border:1px solid #1d4ed840}.lb.tg:hover{background:#1d4ed8;color:#fff}
.hide{display:none !important}
.sb{background:#1a1614;color:#e7e0d9;border:1px solid #2a2420;padding:5px 10px;border-radius:5px;font-size:0.8rem;flex:1;min-width:150px;outline:none}
.sb:focus{border-color:#fbbf24}
#loading{text-align:center;padding:40px;color:#a8a29e}
#error{text-align:center;padding:40px;color:#ef4444;display:none}
#status{color:#a8a29e;font-size:0.75rem}
/* Select / Delete */
.cb-wrap{position:absolute;top:6px;left:6px;z-index:2}
.cb-wrap input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:#fbbf24;opacity:.3;transition:opacity .15s}
.cd:hover .cb-wrap input[type=checkbox]{opacity:.8}
#del-bar{position:fixed;bottom:0;left:0;right:0;background:#1a1614;border-top:2px solid #ef4444;padding:10px 16px;display:none;align-items:center;gap:12px;z-index:100;font-size:.85rem}
#del-bar .cnt{color:#a8a29e;flex:1}
.del-go{background:#ef4444;color:#fff;border:none;padding:6px 20px;border-radius:5px;cursor:pointer;font-weight:600}
.del-go:hover{background:#dc2626}
.del-cancel{background:#2a2420;color:#a8a29e;border:1px solid #5a4a40;padding:6px 16px;border-radius:5px;cursor:pointer}
.del-cancel:hover{color:#e7e0d9}
/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center}
.modal{background:#1a1614;border:1px solid #2a2420;border-radius:12px;padding:24px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto}
.modal h3{color:#fbbf24;margin-bottom:12px}
.modal p{color:#a8a29e;font-size:.85rem;margin-bottom:8px;line-height:1.5}
.modal .del-list{background:#0f0c0a;border-radius:6px;padding:8px 12px;max-height:200px;overflow-y:auto;margin:8px 0;font-size:.75rem;color:#e7e0d9}
.modal .del-list li{padding:2px 0;border-bottom:1px solid #2a2420}
.modal input[type=password]{width:100%;padding:8px 12px;border-radius:6px;border:1px solid #2a2420;background:#0f0c0a;color:#e7e0d9;font-size:.85rem;margin:8px 0;outline:none}
.modal input[type=password]:focus{border-color:#fbbf24}
.modal .btn-row{display:flex;gap:8px;margin-top:12px}
.modal .btn-row button{flex:1;padding:8px;border-radius:6px;border:none;cursor:pointer;font-weight:600}
@media(max-width:600px){.g{grid-template-columns:repeat(2,1fr)}.fb{max-height:80px}}
</style>
</head>
<body>
<div class="hd">
<h1 onclick="location.reload()">🏳️🌈 Comic Gallery</h1>
<button class="tgbtn" id="tgb" onclick="tg()">显示中文</button>
<button class="tgbtn" onclick="fa()">🔄 重置</button>
<input id="sb" class="sb" placeholder="🔍 搜索标题/标签/作者..." oninput="ss()">
</div>
<p class="sub"><span class="cnt" id="status">加载中...</span></p>
<div class="sl">👤 作者筛选 (<span id="acnt">0</span>)</div>
<div class="fb" id="ab"></div>
<div class="sl">🏷 分类筛选 (<span id="tcnt">0</span>)</div>
<div class="fb" id="cb"></div>
<div class="pag" id="pag"></div>
<div id="loading">加载数据中...</div>
<div id="error"></div>
<div class="g" id="g"></div>
<div class="pag" id="pag2"></div>

<div id="del-bar">
  <span class="cnt" id="del-cnt">已选择 0 本</span>
  <button class="del-cancel" onclick="clearSelection()">取消选择</button>
  <button class="del-cancel" onclick="selectAllFiltered()">✅ 全选当前筛选</button>
  <button class="del-go" onclick="showDeleteModal()">🗑 删除选中</button>
</div>

<!-- Delete Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
<div class="modal">
<h3>🗑 确认删除</h3>
<p>将从数据中永久删除以下 <span id="del-count">0</span> 本漫画：</p>
<ul class="del-list" id="del-list"></ul>
<p style="font-size:.75rem">⚠️ 操作不可撤销！删除后需输入 GitHub Token 提交更改。</p>
<input type="password" id="token-input" placeholder="输入 GitHub Token (ghp_...)" autocomplete="off">
<p id="del-status" style="color:#fbbf24;font-size:.8rem"></p>
<div class="btn-row">
<button style="background:#2a2420;color:#a8a29e" onclick="closeModal()">取消</button>
<button id="del-confirm-btn" style="background:#ef4444;color:#fff" onclick="confirmDelete()">确认删除并提交</button>
</div>
</div>
</div>

<script>
var ALL_DATA={}, allComics=[], allTags=[], allAuthors=[];
var sc=false, cp=1, totalPages=1, perPage=20;
var selAuthors=[], selTags=[], searchQ='';
var filtered=[];
var selected=new Set();
var repoOwner='guodongcgd', repoName='comic-gallery', jsonPath='comics.json';

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function renderCard(c){
  var cd=document.createElement('div');cd.className='cd';cd.dataset.id=c.id;
  // Checkbox + delete
  var wrap=document.createElement('div');wrap.className='cb-wrap';
  var cb=document.createElement('input');cb.type='checkbox';cb.dataset.id=c.id;
  cb.checked=selected.has(String(c.id));
  cb.onclick=function(){toggleSelect(this.dataset.id)};
  wrap.appendChild(cb);
  cd.appendChild(wrap);
  // Cover
  var img=document.createElement('img');img.className='cv';img.src=c.cover_url;img.loading='lazy';
  img.onerror=function(){this.style.display='none'};
  cd.appendChild(img);
  // Info
  var di=document.createElement('div');di.className='if';
  var cn=document.createElement('div');cn.className='tt cn';cn.textContent=c.title_cn;di.appendChild(cn);
  var rw=document.createElement('div');rw.className='tt rw';rw.textContent=c.title_original;di.appendChild(rw);
  var mt=document.createElement('div');mt.className='mt';
  mt.textContent='📅 '+c.published_at+' · 📄 '+c.pages+'P · ⭐ '+c.stars;
  di.appendChild(mt);
  if(c.author){
    var sl1=document.createElement('div');sl1.className='sl';sl1.textContent='👤 作者';di.appendChild(sl1);
    var tr1=document.createElement('div');tr1.className='tr';
    var au=document.createElement('span');au.className='ta au';au.textContent=c.author;tr1.appendChild(au);
    di.appendChild(tr1);
  }
  var sl2=document.createElement('div');sl2.className='sl';sl2.textContent='🏷 分类';di.appendChild(sl2);
  var tr2=document.createElement('div');tr2.className='tr';
  for(var i=0;i<c.tags.length;i++){var tg=document.createElement('span');tg.className='ta';tg.textContent=c.tags[i];tr2.appendChild(tg);}
  di.appendChild(tr2);
  var lk=document.createElement('div');lk.className='lk';
  if(c.telegraph_url){var tp=document.createElement('a');tp.href=c.telegraph_url;tp.target='_blank';tp.className='lb tp';tp.textContent='📖 阅读';lk.appendChild(tp);}
  if(c.telegram_url){var tl=document.createElement('a');tl.href=c.telegram_url;tl.target='_blank';tl.className='lb tg';tl.textContent='📱 Telegram';lk.appendChild(tl);}
  di.appendChild(lk);
  cd.appendChild(di);
  return cd;
}

function renderPage(p){
  cp=Math.max(1,Math.min(p,totalPages));
  var start=(cp-1)*perPage,end=Math.min(start+perPage,filtered.length);
  var g=document.getElementById('g');g.innerHTML='';
  for(var i=start;i<end;i++){g.appendChild(renderCard(filtered[i]));}
  renderPagination();applyTitleToggle();
}

function applyFilter(){
  var q=searchQ.toLowerCase();
  filtered=allComics.filter(function(c){
    var ma=true;
    if(selAuthors.length){var found=false;for(var i=0;i<selAuthors.length;i++){if(c.author===selAuthors[i]){found=true;break;}}if(!found)ma=false;}
    if(ma&&selTags.length){var found=false;for(var i=0;i<selTags.length;i++){if(c.tags.indexOf(selTags[i])>=0){found=true;break;}}if(!found)ma=false;}
    if(ma&&q){
      var match=q.split(' ').filter(function(x){return x;});
      for(var i=0;i<match.length;i++){
        var kw=match[i];
        var inTitle=(c.title_cn&&c.title_cn.toLowerCase().indexOf(kw)>=0)||(c.title_original&&c.title_original.toLowerCase().indexOf(kw)>=0);
        var inAuthor=c.author&&c.author.toLowerCase().indexOf(kw)>=0;
        var inTags=false;for(var j=0;j<c.tags.length;j++){if(c.tags[j].toLowerCase().indexOf(kw)>=0){inTags=true;break;}}
        if(!inTitle&&!inAuthor&&!inTags){ma=false;break;}
      }
    }
    return ma;
  });
  totalPages=Math.max(1,Math.ceil(filtered.length/perPage));
  document.getElementById('status').textContent='显示 '+Math.min(filtered.length,perPage)+' / '+filtered.length+' 本 (共'+allComics.length+'本)';
  document.getElementById('acnt').textContent='('+selAuthors.length+'/'+allAuthors.length+')';
  document.getElementById('tcnt').textContent='('+selTags.length+'/'+allTags.length+')';
  renderPage(1);
  updateDelBar();
}

function renderPagination(){
  var tp=totalPages,s=Math.max(0,cp-6),e=Math.min(tp,cp+4);
  var h='';
  if(s>0){h+='<button class="pb" onclick="renderPage(1)">1</button>';if(s>1)h+='<span class="cnt" style="margin:0 5px">...</span>';}
  for(var i=s;i<e;i++)h+='<button class="pb'+(i+1===cp?' on':'')+'" onclick="renderPage('+(i+1)+')">'+(i+1)+'</button>';
  if(e<tp){if(e<tp-1)h+='<span class="cnt" style="margin:0 5px">...</span>';h+='<button class="pb" onclick="renderPage('+tp+')">'+tp+'</button>';}
  document.getElementById('pag').innerHTML=h;document.getElementById('pag2').innerHTML=h;
}

function ft(type,name){
  var arr=type==='author'?selAuthors:selTags;
  var idx=arr.indexOf(name);
  if(idx>=0)arr.splice(idx,1);else arr.push(name);
  applyFilter();updateButtons();
}

function updateButtons(){
  var ab=document.getElementById('ab'),cb=document.getElementById('cb');
  ab.innerHTML='';cb.innerHTML='';
  for(var i=0;i<allAuthors.length;i++){
    var b=document.createElement('button');b.className='tb'+(selAuthors.indexOf(allAuthors[i].name)>=0?' on':'');
    b.textContent=allAuthors[i].name+' ('+allAuthors[i].count+')';
    b.onclick=(function(n){return function(){ft('author',n);}})(allAuthors[i].name);
    ab.appendChild(b);
  }
  for(var i=0;i<allTags.length;i++){
    var b=document.createElement('button');b.className='tb'+(selTags.indexOf(allTags[i].name)>=0?' on':'');
    b.textContent=allTags[i].name+' ('+allTags[i].count+')';
    b.onclick=(function(n){return function(){ft('tag',n);}})(allTags[i].name);
    cb.appendChild(b);
  }
}

function fa(){selAuthors=[];selTags=[];searchQ='';document.getElementById('sb').value='';applyFilter();updateButtons();}
function ss(){searchQ=document.getElementById('sb').value.trim();applyFilter();}
function tg(){sc=!sc;document.getElementById('tgb').textContent=sc?'显示中文':'显示原标题';document.getElementById('tgb').classList.toggle('on',!sc);applyTitleToggle();}
function applyTitleToggle(){document.querySelectorAll('.tt.cn').forEach(function(e){e.style.display=sc?'none':''});document.querySelectorAll('.tt.rw').forEach(function(e){e.style.display=sc?'':'none'});}

// ── Selection & Delete ──
function toggleSelect(id){
  id=String(id);
  if(selected.has(id))selected.delete(id);else selected.add(id);
  updateDelBar();
  var cb=document.querySelector('.cd[data-id="'+id+'"] input[type=checkbox]');
  if(cb)cb.checked=selected.has(id);
}

function clearSelection(){selected.clear();updateDelBar();syncCheckboxes();}
function syncCheckboxes(){
  document.querySelectorAll('.cd input[type=checkbox]').forEach(function(cb){cb.checked=selected.has(cb.dataset.id);});
}

function selectAllFiltered(){
  for(var i=0;i<filtered.length;i++)selected.add(String(filtered[i].id));
  updateDelBar();syncCheckboxes();
}

function updateDelBar(){
  var bar=document.getElementById('del-bar');
  document.getElementById('del-cnt').textContent='已选择 '+selected.size+' 本';
  bar.style.display=selected.size?'flex':'none';
}

function showDeleteModal(){
  if(selected.size===0)return;
  var ids=Array.from(selected);
  var list=document.getElementById('del-list');list.innerHTML='';
  var count=0;
  for(var i=0;i<allComics.length;i++){
    if(selected.has(String(allComics[i].id))){
      count++;
      var li=document.createElement('li');
      li.textContent='#'+allComics[i].id+' '+(allComics[i].title_cn||allComics[i].title_original||'?');
      list.appendChild(li);
      if(count>50){var more=document.createElement('li');more.textContent='... 还有 '+(selected.size-50)+' 本';more.style.color='#ef4444';list.appendChild(more);break;}
    }
  }
  document.getElementById('del-count').textContent=selected.size;
  document.getElementById('del-status').textContent='';
  document.getElementById('token-input').value='';
  document.getElementById('modal-overlay').style.display='flex';
}

function closeModal(){document.getElementById('modal-overlay').style.display='none';}

async function confirmDelete(){
  var token=document.getElementById('token-input').value.trim();
  if(!token){document.getElementById('del-status').textContent='请输入 GitHub Token';return;}
  
  var btn=document.getElementById('del-confirm-btn');
  btn.disabled=true;btn.textContent='提交中...';
  document.getElementById('del-status').textContent='正在获取当前数据...';
  
  async function gh(method,path,body){
    var opts={method:method,headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}};
    if(body)opts.body=JSON.stringify(body);
    var r=await fetch('https://api.github.com/repos/'+repoOwner+'/'+repoName+'/'+path,opts);
    if(!r.ok){var t=await r.text();throw new Error('HTTP '+r.status+': '+(t.slice(0,200)||'empty'));}
    return r.json();
  }
  
  try{
    var idsToDelete=new Set(selected);
    
    // 1. Get raw file via raw.githubusercontent.com (no size limit)
    document.getElementById('del-status').textContent='获取当前数据...';
    var rawResp=await fetch('https://raw.githubusercontent.com/'+repoOwner+'/'+repoName+'/main/'+jsonPath+'?t='+Date.now());
    if(!rawResp.ok)throw new Error('获取文件失败: HTTP '+rawResp.status);
    var rawText=await rawResp.text();
    var data=JSON.parse(rawText);
    
    // 2. Filter
    var before=data.comics.length;
    data.comics=data.comics.filter(function(c){return !idsToDelete.has(String(c.id));});
    var after=data.comics.length;
    var deletedCount=before-after;
    if(deletedCount===0){document.getElementById('del-status').textContent='没有匹配到要删除的漫画';btn.disabled=false;btn.textContent='确认删除并提交';return;}
    
    // 3. Recalculate counts
    var tagCount={}, authorCount={};
    for(var i=0;i<data.comics.length;i++){
      var c=data.comics[i];
      if(c.author&&c.author!=='')authorCount[c.author]=(authorCount[c.author]||0)+1;
      for(var j=0;j<c.tags.length;j++)tagCount[c.tags[j]]=(tagCount[c.tags[j]]||0)+1;
    }
    data.tags=[];for(var n in tagCount)data.tags.push({name:n,count:tagCount[n]});
    data.tags.sort(function(a,b){return b.count-a.count});
    data.authors=[];for(var n in authorCount)data.authors.push({name:n,count:authorCount[n]});
    data.authors.sort(function(a,b){return b.count-a.count});
    
    // 4. Create blob with new content
    document.getElementById('del-status').textContent='创建 blob ('+deletedCount+' 本)...';
    var newJson=JSON.stringify(data);
    var encoded=btoa(unescape(encodeURIComponent(newJson)));
    var blob=await gh('POST','git/blobs',{content:encoded,encoding:'base64'});
    
    // 5. Get current ref + commit tree
    var ref=await gh('GET','git/refs/heads/main');
    var commit=await gh('GET','git/commits/'+ref.object.sha);
    
    // 6. Create new tree with updated file
    var newTree=await gh('POST','git/trees',{
      base_tree:commit.tree.sha,
      tree:[{path:jsonPath,mode:'100644',type:'blob',sha:blob.sha}]
    });
    
    // 7. Create commit
    var newCommit=await gh('POST','git/commits',{
      message:'Delete '+deletedCount+' comic(s) via gallery UI',
      tree:newTree.sha,
      parents:[ref.object.sha]
    });
    
    // 8. Update ref
    await gh('PATCH','git/refs/heads/main',{sha:newCommit.sha,force:false});
    
    document.getElementById('del-status').textContent='✅ 成功删除 '+deletedCount+' 本！页面即将刷新...';
    btn.textContent='✅ 完成';
    selected.clear();
    setTimeout(function(){location.reload();},2000);
    
  }catch(e){
    document.getElementById('del-status').textContent='❌ 错误: '+e.message;
    btn.disabled=false;btn.textContent='确认删除并提交';
  }
}

// ── Init ──
fetch('comics.json').then(function(r){return r.json()}).then(function(d){
  ALL_DATA=d;allComics=d.comics;allTags=d.tags;allAuthors=d.authors;
  document.getElementById('loading').style.display='none';
  document.getElementById('acnt').textContent='('+allAuthors.length+')';
  document.getElementById('tcnt').textContent='('+allTags.length+')';
  updateButtons();applyFilter();
}).catch(function(e){
  document.getElementById('loading').style.display='none';
  document.getElementById('error').style.display='block';
  document.getElementById('error').textContent='加载失败: '+e;
});
</script>
</body>
</html>
